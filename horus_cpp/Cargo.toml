[package]
name = "horus_cpp"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
authors = ["HORUS Team"]
description = "C++ bindings for the HORUS robotics framework — zero-copy shared memory IPC, deterministic scheduling, real-time safety via CXX FFI"
repository = "https://github.com/softmata/horus"
homepage = "https://horusrobotics.dev"
keywords = ["robotics", "cpp", "ffi", "real-time", "horus"]
categories = ["science::robotics", "api-bindings"]

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
horus_core = { path = "../horus_core", default-features = false }
horus_types = { path = "../horus_types" }
horus-robotics = { git = "https://github.com/softmata/horus-robotics.git", rev = "631483a226dc8158a08ffb2c51087b3d02237041" }
horus-tf = { git = "https://github.com/softmata/horus-tf.git", rev = "d525dfcf58b99ee9c015ed5b0b3f20450b7c1e0c" }
cxx = "1.0"
paste = "1.0"
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
cxx-build = "1.0"

[lints]
workspace = true

[dev-dependencies]
horus_core = { path = "../horus_core", default-features = false, features = ["test-utils"] }
criterion = "0.8"
proptest = "1.4"
loom = "0.7"

[[bench]]
name = "ffi_bench"
harness = false
