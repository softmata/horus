[package]
name = "robot_arm"
version = "0.1.0"
description = "6-DOF robot arm — joint control, services, and frame transforms"
authors = ["softmata"]
license = "Apache-2.0"

[dependencies]
horus = "*"
# TransformFrame lives in horus-tf, a separate package. The example used it
# without declaring it, so it did not compile.
horus-tf = { git = "https://github.com/softmata/horus-tf.git", rev = "d525dfcf58b99ee9c015ed5b0b3f20450b7c1e0c" }
