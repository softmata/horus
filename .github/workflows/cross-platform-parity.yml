# HORUS Cross-Platform Behavioral Parity
#
# Verifies that platform-abstracted code (horus_sys) produces identical
# observable behavior on Linux, macOS, and Windows. These tests catch
# behavioral divergences between platform backends (tmpfs vs shm_open vs
# CreateFileMapping, flock vs PID liveness, /proc vs sysctl vs Win32 API).
#
# Unlike multi-platform.yml (which runs generic tests), this workflow
# specifically targets the 87 parity integration tests that verify
# cross-platform contracts.

name: Cross-Platform Parity

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]  # dev is kept identical to main; PRs still gate
  workflow_dispatch:

concurrency:
  # Cancel superseded runs: a rapid series of pushes used to leave every
  # earlier run grinding to completion long after it was obsolete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # ─── Platform Parity Tests ─────────────────────────────────────────────

  parity-linux:
    name: Parity (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: parity-linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: parity-linux-

      - name: Setup SHM directories
        run: |
          # No sudo — see the note in ci.yml. A root-owned 0777 dir both breaks
          # the writers and contradicts the owner-only permission the SHM
          # regression tests assert.
          mkdir -p /dev/shm/horus_ci
          chmod 700 /dev/shm/horus_ci

      - name: Run parity tests (horus_sys)
        run: |
          cargo test --no-default-features -p horus_sys \
            --test parity_shm \
            --test parity_process \
            --test parity_discover \
            --test parity_fs \
            --test parity_platform \
            -- --test-threads=1
        env:
          HORUS_NAMESPACE: ci_linux_${{ github.run_id }}
          RUST_BACKTRACE: 1

      - name: Run horus_sys unit tests
        run: cargo test --no-default-features -p horus_sys --lib -- --test-threads=1
        env:
          HORUS_NAMESPACE: ci_linux_unit_${{ github.run_id }}

  parity-macos:
    name: Parity (macOS ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: parity-macos-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: parity-macos-

      - name: Run parity tests (horus_sys)
        run: |
          cargo test --no-default-features -p horus_sys \
            --test parity_shm \
            --test parity_process \
            --test parity_discover \
            --test parity_fs \
            --test parity_platform \
            -- --test-threads=1
        env:
          HORUS_NAMESPACE: ci_macos_${{ github.run_id }}
          RUST_BACKTRACE: 1

      - name: Run horus_sys unit tests
        run: cargo test --no-default-features -p horus_sys --lib -- --test-threads=1
        env:
          HORUS_NAMESPACE: ci_macos_unit_${{ github.run_id }}

      # The two tests that execute install.sh's and uninstall.sh's own shell
      # code instead of reading it as text — completion_install_contract runs
      # the marked slices against a throw-away $HOME with a stub horus on PATH.
      #
      # They belong on *this* runner specifically. Stock macOS still ships bash
      # 3.2.57 as /bin/bash (Apple never shipped a GPLv3 bash), and no other job
      # in this repository runs `-p horus_manager` on a macOS host, so until now
      # every bash-4-only construct in those scripts — `mapfile`, `${x^^}`,
      # `declare -A` — reached users without ever reaching a runner.
      # uninstall.sh:264 is exactly that: a `mapfile` that a `bash -n` syntax
      # check parses happily and bash 3.2 then fails on at run time.
      - name: Installer shell contracts on a bash 3.2 host
        run: |
          bash --version | head -1
          cargo test -p horus_manager \
            --test install_contract \
            --test completion_install_contract
        env:
          RUST_BACKTRACE: 1

  parity-windows:
    name: Parity (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: parity-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: parity-windows-

      - name: Run parity tests (horus_sys)
        run: |
          cargo test --no-default-features -p horus_sys `
            --test parity_shm `
            --test parity_process `
            --test parity_discover `
            --test parity_fs `
            --test parity_platform `
            -- --test-threads=1
        env:
          HORUS_NAMESPACE: ci_windows_${{ github.run_id }}
          RUST_BACKTRACE: 1

      - name: Run horus_sys unit tests
        run: cargo test --no-default-features -p horus_sys --lib -- --test-threads=1
        env:
          HORUS_NAMESPACE: ci_windows_unit_${{ github.run_id }}

  # ─── Cross-Compile Verification ────────────────────────────────────────

  cross-compile:
    name: Cross-Compile Check (all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust with cross-compile targets
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-pc-windows-msvc,x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cross-compile-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cross-compile-

      - name: Check horus_sys (Windows target)
        run: cargo check --no-default-features --target x86_64-pc-windows-msvc -p horus_sys

      - name: Check horus_sys (macOS target)
        run: cargo check --no-default-features --target x86_64-apple-darwin -p horus_sys

      - name: Check horus_core (Windows target)
        run: cargo check --no-default-features --target x86_64-pc-windows-msvc -p horus_core

      - name: Check horus_core (macOS target)
        run: cargo check --no-default-features --target x86_64-apple-darwin -p horus_core

      # horus_manager is deliberately not cross-checked from this Linux runner.
      # It pulls tree-sitter and tree-sitter-cpp, whose build scripts compile C
      # and bail with "GNU compiler is not supported for this target" without an
      # MSVC toolchain / macOS SDK present. horus_sys and horus_core above are
      # pure Rust and do cross-check cleanly.
      #
      # horus_manager is still covered on both platforms natively: the CLI
      # Parity matrix below builds the horus CLI on windows-latest and
      # macos-latest, and multi-platform.yml builds the workspace there.

  # ─── CLI Workflow Parity ────────────────────────────────────────────────

  cli-parity:
    name: CLI Parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cli-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cli-${{ matrix.os }}-

      - name: Build horus CLI
        run: cargo build --no-default-features -p horus_manager

      # Put the binary where an install would leave it, exactly as install.sh
      # does on its build-from-source path (install.sh:374-377: locate the
      # built binary through CARGO_TARGET_DIR, copy it into the install dir).
      #
      # Both acceptance scripts assert the CLI is on disk in ~/.cargo/bin
      # (acceptance_linux_macos.sh:126-131, acceptance_windows.ps1:87-88), and
      # this job only ever ran `cargo run`, so that assertion was false on every
      # run of every OS. It was invisible because the steps below were
      # continue-on-error; with that gone, the job has to actually install.
      - name: Install the built CLI where an install would put it
        shell: bash
        run: |
          set -euo pipefail
          # Not `[ x = y ] && bin=...`: under `set -e` a false test is the last
          # command of the line, so the step would exit 1 on every non-Windows
          # runner.
          if [ "${RUNNER_OS}" = "Windows" ]; then bin="horus.exe"; else bin="horus"; fi
          dest="${CARGO_HOME:-$HOME/.cargo}/bin"
          # On windows-latest this shell is Git Bash and CARGO_HOME arrives as a
          # Windows path (C:\Users\...), where every backslash is an escape to
          # the MSYS tools below. cygpath is the conversion; acceptance_windows
          # .ps1:87 then looks in the same directory by its Windows name.
          if command -v cygpath >/dev/null 2>&1; then dest=$(cygpath -u "$dest"); fi
          mkdir -p "$dest"
          cp "${CARGO_TARGET_DIR:-target}/debug/${bin}" "${dest}/${bin}"
          chmod +x "${dest}/${bin}"

      - name: Test horus doctor
        run: cargo run --no-default-features -p horus_manager -- doctor
        continue-on-error: true

      - name: Test horus check (current dir)
        run: cargo run --no-default-features -p horus_manager -- check .
        continue-on-error: true

      # No continue-on-error. Both scripts end in `exit $ERRORS`, so the whole
      # acceptance suite was incapable of failing this job: every assertion in
      # it — including Story 7's uninstall.sh check, on the one platform whose
      # /bin/bash is 3.2 — reported through a status the runner then discarded.
      # A suite that cannot go red is a suite nobody is running.
      - name: Run acceptance tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash tests/docker/acceptance_linux_macos.sh

      - name: Run acceptance tests (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File tests/docker/acceptance_windows.ps1

  # ─── Gate ──────────────────────────────────────────────────────────────

  parity-success:
    name: Parity CI Success
    needs: [parity-linux, parity-macos, parity-windows, cross-compile, cli-parity]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs
        run: |
          # cli-parity was listed in `needs` but never checked, so a broken CLI
          # build on any OS still reported the gate as green.
          if [[ "${{ needs.parity-linux.result }}" != "success" ]] || \
             [[ "${{ needs.parity-macos.result }}" != "success" ]] || \
             [[ "${{ needs.parity-windows.result }}" != "success" ]] || \
             [[ "${{ needs.cli-parity.result }}" != "success" ]] || \
             [[ "${{ needs.cross-compile.result }}" != "success" ]]; then
            echo "❌ Parity CI failed"
            exit 1
          fi
          echo "✅ All parity checks passed"
