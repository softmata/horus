# HORUS CI Pipeline
# Runs on all PRs and pushes to main/dev

name: CI

on:
  pull_request:
    branches: [main, master, dev]
  push:
    branches: [main, master]  # dev mirrors main; PRs still gate dev work

concurrency:
  # Cancel superseded runs: a rapid series of pushes used to leave every
  # earlier run grinding to completion long after it was obsolete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Allow warnings on dev branch, strict on main.
  #
  # github.ref is refs/pull/N/merge for a pull_request event, so gating on it
  # alone meant the strict path ONLY ever ran after a PR had already merged —
  # a PR could introduce a warning, go green, and then break main where nothing
  # could be gated on it. github.base_ref is the PR's target branch, so this
  # applies the same gate the merge commit will face. Same policy, enforced
  # before the merge instead of after.
  RUSTFLAGS: ${{ (github.ref == 'refs/heads/main' || github.base_ref == 'main') && '-D warnings' || '-W warnings' }}
  # horus_manager's cargo_gen/cmake_gen/new/pkg tests generate .horus build
  # files, which needs the HORUS source tree. find_horus_source_dir() only
  # probes ~/softmata/horus, ~/horus, /opt/horus etc. — none of which exist
  # on a runner — so point it at the checkout.
  HORUS_SOURCE: ${{ github.workspace }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-check-

      # horus_py cannot ride along in an --all-targets sweep: --all-targets
      # builds the lib TEST target, and horus_py/src/lib.rs raises a
      # compile_error! whenever cfg(test) and the default `extension-module`
      # feature are both on (pyo3 leaves Python's symbols to the interpreter
      # that dlopens the .so, so a test binary has nothing to link them
      # against). Cargo cannot vary features per target, so the crate gets a
      # second pass with the feature off instead — it is excluded from the
      # sweep, never from coverage. Same split the test job uses below.
      - name: Cargo Check
        run: cargo check --workspace --all-targets --exclude horus_py

      - name: Cargo Check (horus_py)
        run: cargo check -p horus_py --all-targets --no-default-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-

      - name: Clippy
        run: |
          # See the RUSTFLAGS comment at the top: a PR event never has
          # github.ref == refs/heads/main, so also honour the PR target branch.
          #
          # horus_py is linted in its own pass with --no-default-features for
          # the reason spelled out in the check job: --all-targets builds its
          # lib test target, and the `extension-module` default feature makes
          # that a compile_error!. Splitting it out keeps it linted rather than
          # dropping it from coverage.
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.base_ref }}" == "main" ]]; then
            cargo clippy --workspace --all-targets --exclude horus_py -- -D warnings
            cargo clippy -p horus_py --all-targets --no-default-features -- -D warnings
          else
            cargo clippy --workspace --all-targets --exclude horus_py
            cargo clippy -p horus_py --all-targets --no-default-features
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HORUS_NAMESPACE: ci_${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # cmake_gen's real_cmake_* tests shell out to cmake and
          # find_package(Eigen3/fmt/GTest), so those dev packages must exist.
          sudo apt-get install -y libudev-dev pkg-config \
            cmake libeigen3-dev libfmt-dev libgtest-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Build Python extension for cross-language tests
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip maturin
          .venv/bin/maturin develop --release --manifest-path horus_py/Cargo.toml
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # No caching for test job - build completely fresh to avoid linker errors
      # Caching caused issues with stale artifacts and filename collisions

      - name: Clean build artifacts
        run: cargo clean

      # Setup shared memory for HORUS tests
      - name: Setup Shared Memory
        run: |
          # Create namespaced SHM directory structure
          SHM_DIR="/dev/shm/horus_ci_${GITHUB_RUN_ID:-$$}"
          # No sudo: sudo mkdir leaves these root-owned, which is what made
          # SchedulerRegistry::open and the presence writer fail with
          # PermissionDenied. Create them as the runner and keep 0700 —
          # regression_shm_topics_dir_permissions_restricted asserts the topics
          # dir is owner-only, so chmod 777 here would break that guarantee.
          mkdir -p "$SHM_DIR"/{topics,nodes,control,network,scheduler}
          chmod -R 700 "$SHM_DIR"

      # Build and test in separate steps to avoid crate-type collision
      # Exclude horus_py from the Rust workspace build/test because its
      # extension-module feature prevents test linking. The extension used by
      # cross-language tests is installed into the job venv above; Rust-only
      # horus_py tests run separately below with --no-default-features.
      - name: Build Workspace
        run: cargo build --workspace --exclude horus_py

      - name: Run Tests
        run: |
          # Use single-threaded tests to avoid race conditions in static discovery topic
          # (UnsafeCell<LocalState> is not thread-safe for parallel test access)
          # Cross-process and long-running scenario binaries are covered by the
          # dedicated integration workflows. Keep this gate to deterministic
          # crate unit tests so one shared namespace cannot leak between bins.
          cargo test --workspace --exclude horus_py --lib --no-fail-fast -- \
            --test-threads=1 \
            --skip topic_cross_thread_1p_multi_c_spmc \
            --skip topic_cross_thread_mpmc_pre_initialized_99_percent \
            --skip topic_cross_thread_multi_p_multi_c_mpmc \
            --skip test_robotics_autonomous_car_perception
        env:
          RUST_BACKTRACE: 1

      # The resolver's crates.io/PyPI tests carry #[ignore] so a contributor
      # without network access gets a green suite and a failure means the
      # resolver is wrong rather than the network. CI does have access, so it
      # runs them — but never lets an outage or a rate-limit (crates.io returns
      # HTTP 403 when it throttles) fail the build for everyone.
      - name: Run network-dependent resolver tests (advisory)
        continue-on-error: true
        run: |
          cargo test -p horus_manager --lib source_resolver -- --ignored
        env:
          RUST_BACKTRACE: 1

      - name: Run horus_py unit tests
        run: |
          # Test horus_py with extension-module disabled (avoids Python linker dependency)
          cargo test -p horus_py --no-default-features -- --test-threads=1
        env:
          RUST_BACKTRACE: 1

      # The Python suite is the ONLY coverage the horus_py binding layer has:
      # this workspace passes --exclude horus_py to cargo test here, to
      # coverage.yml's llvm-cov, to safety.yml's miri/sanitizer runs and to
      # integration-tests.yml, and the crate ships no Rust tests/ directory.
      # Nothing ran the Python side either -- no workflow invoked pytest at all,
      # so 407 test functions, 434 cases after parametrisation, sat in the tree
      # looking like coverage while gating nothing. The extension is already
      # built and installed into .venv above for the Rust cross-language tests,
      # so this is one step, not a new job: the whole suite runs in ~30s.
      - name: Run horus_py Python test suite
        run: |
          # Mirrors [project.optional-dependencies].test in horus_py/pyproject.toml
          .venv/bin/pip install pytest pytest-cov pytest-timeout numpy
          # horus/__init__.py CATCHES ImportError and falls back to "mock mode"
          # with Topic = None and a RuntimeWarning, so `import horus` succeeds
          # even when the extension was never built. Without this assert, a
          # silently-failed `maturin develop` above leaves the whole suite
          # running against a null API -- the job stays green and the coverage
          # it is here to provide is gone. Fail on the build, not on the tests.
          "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
          import horus, sys
          if horus.Topic is None:
              sys.exit("horus imported in MOCK MODE -- the extension did not build, "
                       "so the suite below would test nothing")
          PY
          cd horus_py
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest tests/ -p no:cacheprovider
        env:
          RUST_BACKTRACE: 1

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # The key carries an ISO week so the gate's own binary cannot be frozen.
      # `actions/cache` writes only on a MISS, and the previous key
      # (`${{ runner.os }}-cargo-audit-bin`) contained nothing that ever
      # changes: the first run to populate it pinned cargo-audit at whatever
      # version was current that day, permanently — the install step below is
      # guarded by `command -v`, so it never ran again, and the cache never
      # missed again, so it was never re-saved either. That matters because a
      # cargo-audit older than an advisory-db format change SKIPS the entries
      # it cannot parse and still exits 0: the gate goes quietly blind while
      # CI stays green, which is the same failure mode as a stale entry in
      # .cargo/audit.toml. Rotating the key weekly bounds the staleness at one
      # week and costs one `cargo install` per week. No `restore-keys` — a
      # prefix fallback would hit last week's entry and defeat the rotation.
      - name: Cache epoch for cargo-audit
        id: audit_epoch
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-${{ steps.audit_epoch.outputs.week }}

      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked

      - name: Run Security Audit
        run: |
          # Triaged advisory ignore-list lives in .cargo/audit.toml (each entry
          # explains why it is tolerated and what would let us remove it).
          # A NEW vulnerable dependency outside that list fails CI on main.
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.base_ref }}" == "main" ]]; then
            cargo audit
          else
            cargo audit || echo "::warning::Security audit found issues (non-blocking on this branch — strict on main)"
          fi

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-doc-

      - name: Check Documentation
        run: |
          # Exclude horus_manager to avoid filename collision with horus library
          # (both would create target/doc/horus/ due to binary named 'horus')
          #
          # horus_py needs NO split here, unlike the check and clippy jobs:
          # rustdoc never sets cfg(test) and never links a test binary, so the
          # `extension-module` guard in horus_py/src/lib.rs does not fire. It is
          # also the right call — docs should describe the crate as it ships,
          # i.e. with its default features on.
          cargo doc --workspace --no-deps --exclude horus_manager
        env:
          RUSTDOCFLAGS: ${{ (github.ref == 'refs/heads/main' || github.base_ref == 'main') && '-D warnings' || '' }}

  loom:
    name: Loom Concurrency Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-loom-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-loom-

      # Loom exhaustively explores all thread interleavings.
      # Tests use at most 3 threads with minimal operations to keep runtimes
      # tractable (seconds, not hours).
      # `loom_ring_buffers` modelled the spsc/spmc/mpsc/mpmc_intra rings, which
      # were deleted with the intra backends (3d7f279f). `loom_fanout` is the
      # live successor: it models the shared seqlock protocol ShmFanoutRing uses.
      - name: Loom — fanout seqlock (horus_core)
        run: cargo test -p horus_core --test loom_fanout -- --nocapture
        env:
          RUST_LOG: loom=debug

      # PodShm broadcast is the DEFAULT backend for POD types and its producer
      # has no backpressure, so a lapping producer can overwrite a slot the
      # consumer is mid-copy. The model's `naive` variant reproduces the old
      # protocol and FAILS, which is what proves this test is not vacuous.
      - name: Loom — PodShm broadcast seqlock (horus_core)
        run: cargo test -p horus_core --test loom_pod_broadcast -- --nocapture
        env:
          RUST_LOG: loom=debug

      - name: Loom — watchdog / PRNG / deterministic clock (horus_core)
        run: cargo test -p horus_core --test loom_concurrency -- --nocapture
        env:
          RUST_LOG: loom=debug

      - name: Loom — migration protocol (horus_core)
        run: cargo test -p horus_core --test loom_migration -- --nocapture
        env:
          RUST_LOG: loom=debug

      # loom_migration covers the epoch/lock (control plane) and loom_mp_claim
      # covers the CAS claim, but neither combines them -- and the TSan warning
      # on the migration path needs BOTH a ring wrap and a migration to appear.
      # This model is the intersection: a cached consumer position, batched
      # publishes so the shared tail lags, and a resync mid-drain. Its gate is
      # documented in the file: dropping the `max` from `resynced_tail` makes it
      # deliver a slot twice.
      - name: Loom — migration resync vs. data plane (horus_core)
        run: cargo test -p horus_core --test loom_migration_data_plane -- --nocapture
        env:
          RUST_LOG: loom=debug

      - name: Loom — participant registration (horus_core)
        run: cargo test -p horus_core --test loom_participant -- --nocapture
        env:
          RUST_LOG: loom=debug

      # NOTE: the TransformFrame seqlock loom test moved to the external
      # horus-tf repo when horus_library was decomposed (commit 7b430279).
      # It is exercised by horus-tf's own CI, not this workspace.

  test-quality:
    name: Test Quality Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan for stub test anti-patterns
        run: |
          FAILED=0

          echo "=== Checking for tautological assertions ==="
          # is_ok() || is_err() — always true, never tests anything
          if grep -rn 'is_ok().*||.*is_err()\|is_err().*||.*is_ok()' --include='*.rs' .; then
            echo "::error::Found tautological is_ok() || is_err() assertions"
            FAILED=1
          fi

          echo "=== Checking for standalone matches!() with semicolon ==="
          # matches!(...); as a statement — result is silently discarded
          # Multi-line assert!(matches!(...)) is fine and excluded
          BARE_MATCHES=$(grep -rn '^\s*matches!(' --include='*.rs' . | grep -v 'assert' | while read line; do
            file=$(echo "$line" | cut -d: -f1)
            lineno=$(echo "$line" | cut -d: -f2)
            prev=$(sed -n "$((lineno-1))p" "$file" 2>/dev/null)
            if ! echo "$prev" | grep -q 'assert'; then
              thisline=$(sed -n "${lineno}p" "$file")
              if echo "$thisline" | grep -q ';$'; then
                echo "$line"
              fi
            fi
          done)
          if [ -n "$BARE_MATCHES" ]; then
            echo "$BARE_MATCHES"
            echo "::error::Found standalone matches!() with semicolon — bool return is discarded"
            FAILED=1
          fi

          echo "=== Checking for let _ = format!() in tests ==="
          # let _ = format!("{:?}", x) in test code discards Debug output without checking
          if grep -rn 'let _ = format!' --include='*.rs' . | grep -i 'test\|#\[cfg(test'; then
            echo "::warning::Found 'let _ = format!()' in test code — assert the output instead"
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Test quality checks failed. See above for details."
            exit 1
          fi

          echo "All test quality checks passed!"

  # Final status check
  ci-success:
    name: CI Success
    needs: [check, fmt, clippy, test, doc, security, loom, test-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check Results
        run: |
          # Core checks must pass
          if [[ "${{ needs.check.result }}" == "success" ]] && \
             [[ "${{ needs.fmt.result }}" == "success" ]] && \
             [[ "${{ needs.clippy.result }}" == "success" ]] && \
             [[ "${{ needs.test.result }}" == "success" ]] && \
             [[ "${{ needs.doc.result }}" == "success" ]] && \
             [[ "${{ needs.loom.result }}" == "success" ]] && \
             [[ "${{ needs.security.result }}" == "success" ]] && \
             [[ "${{ needs.test-quality.result }}" == "success" ]]; then
            echo "All core checks passed!"
            exit 0
          else
            echo "Some checks failed"
            echo "check: ${{ needs.check.result }}"
            echo "fmt: ${{ needs.fmt.result }}"
            echo "clippy: ${{ needs.clippy.result }}"
            echo "test: ${{ needs.test.result }}"
            echo "doc: ${{ needs.doc.result }}"
            echo "loom: ${{ needs.loom.result }}"
            echo "test-quality: ${{ needs.test-quality.result }}"
            exit 1
          fi
