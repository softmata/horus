name: Benchmark CI

on:
  push:
    branches: [ main ]  # dev is kept identical to main; PRs still gate
  pull_request:
    branches: [ main, dev ]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  # Cancel superseded runs: a rapid series of pushes used to leave every
  # earlier run grinding to completion long after it was obsolete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

  # ---------------------------------------------------------------------------
  # The performance gate
  #
  # HORUS's figure of merit is worst-case latency and jitter first, median
  # second. A change that improves the median and widens the tail is a
  # regression here.
  #
  # There used to be a `REGRESSION_THRESHOLD: 10` here. Nothing enforced it: the
  # step named "Check for performance regression" only grepped the benchmark's
  # own stdout for a PASS/FAIL string, `benchmarks/baseline.json` was restored
  # from a cache that nothing ever wrote, and `BenchmarkReport::compare` — the
  # only baseline-relative comparison in the tree — had no caller at all. It was
  # also median-only: it computed `p99_change_percent`, stored it, and never
  # read it, so a change that left the median alone and added 50 µs to p99
  # reported "All benchmarks within acceptable range".
  #
  # There is no single threshold any more, because there cannot be one honest
  # number: each metric is gated at `max(relative, center + k·σ_observed,
  # absolute floor)` against a rolling window, so the band is derived from the
  # noise the baseline itself measured. The thresholds, the enforcement split
  # between blocking and report-only, and the reasoning for every number live in
  # `RegressionPolicy` in benchmarks/src/output.rs — one place, next to the code
  # that applies them, instead of a YAML constant that drifts away from what
  # runs.
  # ---------------------------------------------------------------------------

  # Repetitions of each benchmark per job. The gate reduces them to their
  # median, so one bad draw out of three cannot fail the build; below 3 there is
  # no median to take, only an average, which a single outlier drags halfway.
  # This is the main lever on job duration: lower it and the current arm gets
  # noisier, which the gate reports rather than hides.
  BENCH_REPETITIONS: 3

  # How many past trunk runs the rolling baseline keeps. The window has to be
  # long enough to estimate a spread (the gate needs 5 before it trusts one) and
  # short enough to still describe current trunk.
  BENCH_WINDOW: 20

  # The rolling baseline itself. Lives in the Actions cache, written only by
  # pushes to main.
  BENCH_HISTORY: baseline-history.json

permissions:
  contents: read
  # Read the previous trunk run's artifact to recover the rolling baseline.
  # The baseline cannot live in the Actions cache; see "Restore rolling
  # baseline" below. Read-only: nothing here writes to the repository.
  actions: read
  pull-requests: write  # benchmark job posts/updates a PR comment via github-script

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    env:
      HORUS_NAMESPACE: ci_${{ github.run_id }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The gate's baseline is a cache artifact, not a git history walk, so it
        # does not need this. Kept for provenance: the report records the commit
        # under test and the commit the baseline window was gathered on.
        fetch-depth: 0

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        components: rustfmt, clippy

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          linux-tools-common \
          linux-tools-generic \
          gnuplot \
          libudev-dev

    - name: Configure CPU for benchmarks
      run: |
        # Disable CPU frequency scaling for consistent results (may fail on some runners)
        echo "performance" | sudo tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor || true

        # Disable turbo boost
        echo 1 | sudo tee /sys/devices/system/cpu/intel_pstate/no_turbo || true

        # Both of the above are best-effort on a hosted runner, and when they
        # fail they fail silently. Print what actually took effect: every
        # reported nanosecond scales with core frequency (RDTSC counts at the
        # nominal rate while the work costs a fixed number of core cycles), so a
        # baseline window that mixes governors is a window whose spread is
        # measuring the governor. The gate records the governor with each run.
        echo "--- effective CPU configuration ---"
        cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || echo "governor: unavailable"
        cat /sys/devices/system/cpu/intel_pstate/no_turbo 2>/dev/null || echo "no_turbo: unavailable"
        grep -m1 'model name' /proc/cpuinfo || true
        nproc

    - name: Cache cargo dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

    - name: Restore rolling baseline
      # The baseline is restored from the previous trunk run's ARTIFACT, not
      # from the Actions cache.
      #
      # It used to come from the cache, and the cache could not hold it. On
      # 2026-09-04 the gate's own output on the newest green trunk run read:
      #
      #     baseline  : none — rolling window of 0 run(s)
      #
      # with `N/A (no baseline)` against every metric of every benchmark. The
      # window had gone 3 -> 1 -> 1 -> 1 over four trunk runs, and the repo held
      # zero `benchmark-history-*` caches. The save was not failing — the log
      # says `Cache saved with key: benchmark-history-main-33808800880` — the
      # entry was being evicted before the next run could read it.
      #
      # Why: Actions caches share a 10 GB per-repository quota and are evicted
      # least-recently-used. This repo sits at ~9.84 GB across ~20 cargo caches
      # of 300 MB-1 GB, each touched by some workflow on nearly every push. The
      # baseline is 4 KB and is read by one job on one branch. It is always the
      # LRU victim. Six seconds after saving it, this very job saves a ~500 MB
      # `Linux-cargo-bench-*` entry, so the benchmark job helps evict its own
      # baseline.
      #
      # Artifacts are not subject to that quota or that eviction: every
      # `benchmark-results` artifact from the same period was still downloadable
      # when the caches were gone. So the window is carried in the artifact this
      # job already uploads, and no new storage is introduced.
      #
      # Best-effort by construction. A missing artifact (first run ever,
      # retention expiry, a run that failed before upload) leaves the file
      # absent, and `BaselineHistory::load` degrades to an empty window with a
      # warning — the documented behaviour. It must never fail the build: a gate
      # people cannot get past is a gate people delete.
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail
        mkdir -p benchmarks

        # The newest successful run of THIS workflow on main, excluding the
        # current one (a re-run of this same run id would restore its own
        # output and freeze the window).
        PREV=$(gh run list \
                 --repo "$GITHUB_REPOSITORY" \
                 --workflow "${{ github.workflow }}" \
                 --branch main \
                 --status success \
                 --limit 20 \
                 --json databaseId \
                 --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | .[0].databaseId" \
               2>/dev/null || true)

        if [ -z "${PREV:-}" ] || [ "$PREV" = "null" ]; then
          echo "No previous successful trunk run found; starting an empty window."
          exit 0
        fi

        echo "Restoring rolling baseline from run $PREV"
        if gh run download "$PREV" \
             --repo "$GITHUB_REPOSITORY" \
             -n benchmark-results \
             -D /tmp/prev-bench 2>/dev/null \
           && [ -f "/tmp/prev-bench/$BENCH_HISTORY" ]; then
          cp "/tmp/prev-bench/$BENCH_HISTORY" "benchmarks/$BENCH_HISTORY"
          RUNS=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1]))['runs']))" \
                   "benchmarks/$BENCH_HISTORY" 2>/dev/null || echo "?")
          echo "Recovered a window of $RUNS run(s) from run $PREV."
        else
          echo "Run $PREV has no usable $BENCH_HISTORY; starting an empty window."
        fi

    - name: Setup Shared Memory
      run: |
        # Create namespaced SHM directory structure
        SHM_DIR="/dev/shm/horus_ci_${GITHUB_RUN_ID:-$$}"
        # No sudo: sudo mkdir leaves these root-owned, which is what made
        # SchedulerRegistry::open and the presence writer fail with
        # PermissionDenied. Create them as the runner and keep 0700 —
        # regression_shm_topics_dir_permissions_restricted asserts the topics
        # dir is owner-only, so chmod 777 here would break that guarantee.
        mkdir -p "$SHM_DIR"/{topics,nodes,control,network,scheduler}
        chmod -R 700 "$SHM_DIR"

    - name: Build benchmarks
      run: |
        cd benchmarks
        # Builds every bin in the package, including regression_gate.
        cargo build --release

    - name: Run benchmarks
      run: |
        # Actions' default shell is `bash -e {0}` WITHOUT pipefail, so a panic or
        # SIGSEGV in the benchmark would be masked by tee's exit status.
        set -o pipefail
        cd benchmarks
        mkdir -p gate-reports
        : > benchmark-results.txt

        SHM_DIR="/dev/shm/horus_ci_${GITHUB_RUN_ID:-$$}"

        for rep in $(seq 1 "$BENCH_REPETITIONS"); do
          echo "===== repetition ${rep}/${BENCH_REPETITIONS} =====" | tee -a benchmark-results.txt

          cargo run --release --bin cross_process_benchmark -- \
            --json "$PWD/gate-reports/cross_process-${rep}.json" \
            | tee -a benchmark-results.txt

          cargo run --release --bin robotics_messages_benchmark -- \
            --json "$PWD/gate-reports/robotics-${rep}.json" \
            | tee -a benchmark-results.txt

          # Between repetitions only. Leftover segments from the previous
          # repetition are warm page cache the next one would inherit, which is
          # a difference between repetitions that is not a difference in the
          # code.
          rm -rf "$SHM_DIR"/topics/* 2>/dev/null || true
        done

        echo "--- reports produced ---"
        ls -l gate-reports/

    - name: Real-time suitability check
      run: |
        cd benchmarks
        # robotics_messages_benchmark prints its own real-time suitability
        # verdicts (the "✓ PASS" / "✗ FAIL" lines for the 1kHz/10kHz/500Hz/40Hz
        # criteria) but always exits 0. This is an absolute check against a
        # fixed deadline, independent of any baseline, so it runs even on the
        # very first build where the rolling window is empty.
        if grep -q '✗ FAIL' benchmark-results.txt; then
          echo "::error::Benchmark failed its real-time suitability criteria:"
          grep -n '✗ FAIL' benchmark-results.txt
          exit 1
        fi
        echo "All benchmark real-time suitability checks passed."

    - name: Performance gate
      id: gate
      run: |
        cd benchmarks

        CURRENT=""
        for f in gate-reports/*.json; do
          CURRENT="$CURRENT --current $f"
        done
        if [ -z "$CURRENT" ]; then
          echo "::error::No benchmark JSON reports were produced. Nothing was gated."
          exit 1
        fi

        # --record rewrites the rolling baseline and must only ever happen on a
        # trunk build: recording a pull request would let a regression become
        # its own baseline. --trunk additionally enables the
        # consecutive-runs escalation, which turns sustained tail creep that no
        # single run can distinguish from noise into a blocking failure. It is
        # deliberately off for pull requests: a PR author is not responsible for
        # drift that landed on main before their branch, and a gate that fails
        # people for someone else's commit gets switched off within a week.
        TRUNK=""
        if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
          TRUNK="--trunk --record"
        fi

        "$GITHUB_WORKSPACE/target/release/regression_gate" \
          --history "$BENCH_HISTORY" \
          $CURRENT \
          --window "$BENCH_WINDOW" \
          --markdown /tmp/benchmark-report.md \
          --json gate-comparison.json \
          $TRUNK \
          | tee gate-output.txt
        GATE_STATUS=${PIPESTATUS[0]}

        if [ "$GATE_STATUS" -ne 0 ]; then
          # Surface the blocking findings as annotations so they appear on the
          # job summary rather than only in the log.
          grep -E '^\s+BLOCKING: ' gate-output.txt | while read -r line; do
            echo "::error::performance gate: ${line}"
          done
          echo "::error::Performance gate failed. The step log above prints, for every"
          echo "::error::benchmark: the baseline distribution, the current distribution, the"
          echo "::error::threshold that was crossed, and where that threshold came from."
        fi
        exit "$GATE_STATUS"

    - name: Report the baseline window
      # A gate with no baseline PASSES. That is the property that let this go
      # unnoticed for four trunk runs: `rolling window of 0 run(s)`, `N/A (no
      # baseline)` on every metric, and a green check. The size of the window is
      # the one number that says whether the gate did any work, so it is raised
      # to an annotation and the job summary rather than left on line 4 of a log
      # nobody opens on a green run.
      if: always()
      run: |
        set -uo pipefail
        WINDOW=$(sed -n 's/.*rolling window of \([0-9]*\) run(s).*/\1/p' \
                   benchmarks/gate-output.txt 2>/dev/null | head -1)
        WINDOW=${WINDOW:-unknown}

        {
          echo "## Performance gate baseline"
          echo
          echo "Rolling window: **${WINDOW} run(s)**"
        } >> "$GITHUB_STEP_SUMMARY"

        # One line each: an annotation is a single line, and a backslash
        # continuation would carry this file's indentation into the message.
        if [ "$WINDOW" = "0" ]; then
          echo "::warning::Performance gate ran with an EMPTY baseline — every metric reported N/A and nothing was compared. A green check here does not mean performance held. Expected only on the first trunk run, or after artifact retention lapses."
        elif [ "$WINDOW" != "unknown" ] && [ "$WINDOW" -lt 5 ] 2>/dev/null; then
          echo "::notice::Baseline window is ${WINDOW} run(s). The gate needs 5 before it trusts a measured spread; until then only gross regressions can fail it."
        fi

    # The rolling baseline is no longer saved to the Actions cache. It is
    # carried forward by the `benchmark-results` artifact uploaded below, which
    # already contains `${{ env.BENCH_HISTORY }}` and is what the next trunk run
    # restores from. Saving to the cache as well would write an entry that is
    # evicted before it is ever read, and whose presence made the window look
    # maintained while the gate compared nothing.

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: benchmark-results
        path: |
          benchmarks/benchmark-results.txt
          benchmarks/gate-reports/
          benchmarks/gate-comparison.json
          benchmarks/gate-output.txt
          benchmarks/${{ env.BENCH_HISTORY }}

    - name: Comment PR with results
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const fs = require('fs');

          let summary = "";
          try {
            summary = fs.readFileSync('/tmp/benchmark-report.md', 'utf8');
          } catch (e) {
            summary =
              "## Benchmark gate\n\n" +
              ":warning: The gate produced no report. The benchmarks or the gate itself " +
              "failed before a comparison could be made — see the job log. **This is not a pass.**";
          }

          try {
            const raw = fs.readFileSync('benchmarks/benchmark-results.txt', 'utf8');
            summary +=
              "\n<details><summary>Raw benchmark output</summary>\n\n```\n" +
              raw.slice(-40000) +
              "\n```\n\n</details>\n";
          } catch (e) { /* the gate report is the deliverable; raw output is a bonus */ }

          summary += "\n---\n";
          summary +=
            "*Gated against a rolling window of recent `main` runs. Each metric's band is " +
            "`max(relative, center + k·sigma_observed, absolute floor)`, so it is derived from the " +
            "noise the baseline itself measured — where a band is printed wider than the change " +
            "you care about, this run did not detect a regression and could not have. Thresholds " +
            "and their reasoning: `RegressionPolicy` in `benchmarks/src/output.rs`.*\n";
          summary += `*Commit: ${{ github.sha }}*`;

          // Find and update existing comment or create new one
          const { data: comments } = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });

          const botComment = comments.find(comment =>
            comment.user.type === 'Bot' &&
            (comment.body.includes('Benchmark gate') || comment.body.includes('Benchmark Results'))
          );

          if (botComment) {
            await github.rest.issues.updateComment({
              comment_id: botComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
          } else {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
          }
