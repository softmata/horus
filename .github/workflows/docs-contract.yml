# Docs Contract — guarantee this repo never breaks the published documentation.
#
# The docs repo (softmata/horus-docs) already verifies its own code blocks, but
# that workflow clones horus@main: it answers "have the docs drifted from
# released horus?", never "does this PR break the docs?". A PR here that renames
# a flag or changes a struct field turns documented instructions into errors
# while every check stays green.
#
# This workflow closes that direction. Three tiers, cheapest first:
#
#   1. contract-hermetic  — every PR, no network, no docs checkout. Everything
#                           that can be asserted from this repository alone.
#                           A test that has to open a documentation page is
#                           `#[ignore]`d and belongs to tier 2, not here.
#   2. contract-live      — every PR, clones horus-docs at a pinned commit and
#                           re-extracts, so docs changes are seen too. Runs the
#                           tier-1 binaries again with --include-ignored.
#   3. examples-compile   — nightly + manual. Compiles the documented Rust
#                           examples against the real horus crate.
#
# Tiers 1 and 2 take seconds. Tier 3 takes minutes, so it is not a PR gate.
#
# shipped-examples-build sits outside that ladder: it builds this repository's
# own examples/ projects, needs no docs checkout, and runs on every PR.

name: Docs Contract

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
  schedule:
    # 04:00 UTC daily — the compile sweep.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      run_compile_sweep:
        description: 'Also run the Rust example compile sweep'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the default GITHUB_TOKEN. Nothing here writes to the
# repository: every job reads code, builds it, and runs tests. The one job that
# produces an artifact (examples-compile) uses actions/upload-artifact, which
# needs no repository scope.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned so a docs edit can never turn this repo's CI red on its own. Bump it
  # deliberately, to the newest docs commit that is *verified* to pass — a pin
  # is a claim about a specific tree, so check it before changing it:
  #
  #     HORUS_DOCS_DIR=<horus-docs checkout> \
  #       cargo test -p horus_manager --test docs_contract -- --include-ignored
  #     HORUS_DOCS_DIR=<horus-docs checkout> \
  #       cargo test -p horus_manager --test docs_cli_contract
  #
  # 9505c1d (softmata/horus-docs main, the merge of horus-docs#6) is verified
  # that way: docs_contract 14/14, docs_cli_contract 7/7 and docs_manifest 6/6 —
  # the whole live tier, run against this exact commit, not against the branch it
  # came from.
  #
  # The two pins before it were each stale in a different direction, and the
  # difference decides what "bump the pin" can and cannot fix. b16c640 failed ten
  # of docs_contract's fourteen: ordinary drift, already fixed in horus-docs, and
  # a bump was the whole remedy. Moving to docs main did NOT work at the time —
  # ad67082 and 5288fbf had added eight section landing pages (advanced, cpp,
  # development, learn, operations, performance, reference, stdlib) without
  # listing them in `sections` in components/DocsSidebar.tsx, so nothing linked to
  # them and every_docs_page_is_reachable_from_the_navigation failed 13/14 at
  # every commit from ad67082 through 5c83485. No choice of pin could fix that,
  # because there was no commit anywhere in horus-docs where those pages were
  # reachable; horus-docs#6 is the commit that made them so, and also republished
  # public/schema/horus.toml.schema.json, which had drifted from what the manifest
  # structs generate.
  #
  # This is also a trust boundary, which is why there is no `docs_ref` input to
  # override it. `schedule` and `workflow_dispatch` run in default-branch
  # context with write access to the Actions cache, so building an arbitrary
  # ref of another repository here would let anyone who can push to
  # softmata/horus-docs get code executed in this repo's privileged context —
  # an escalation across repos that this repo's own review never sees.
  # Verifying a different docs commit means bumping this SHA in a PR, so the
  # change is reviewed here before it runs here.
  #
  # Bumped from 4a612b1 to 9a1a0c1 (horus-docs main, the merge of
  # horus-docs#17). That PR is the documentation half of the same bidirectional
  # audit this branch is the code half of, so the two belong at the same pin:
  # against 4a612b1 the contract validates this branch's runtime corrections
  # against pages that still describe what the runtime did BEFORE them, which
  # is the drift the audit existed to find. Exactly one commit, and 4a612b1 is
  # its parent. Verified from this tree: 14 passed, 0 failed.
  #
  # Bumped from 38368c8 to 4a612b1 (horus-docs main, the merge of
  # horus-docs#18), for the same reason 38368c8 replaced af057d9 before it.
  # This branch adds six operator-facing variables — HORUS_RECORD_MAX_MB,
  # HORUS_RECORD_INTERVAL, HORUS_RT_IDLE_LATENCY_US,
  # HORUS_RT_IDLE_LATENCY_SCOPE, HORUS_SEND_RETRY_BUDGET_US and
  # HORUS_WIN_REALTIME_CLASS — and horus-docs#18 is the commit that writes them
  # into the environment-variable reference. Note that only three of the six
  # made the old pin fail: the other three are named through a `const` rather
  # than a literal at the `env::var` call site, and the scanner could not see
  # that spelling until this branch taught it to, so the pin and the scanner
  # fix have to land together. The old pin is an ancestor of the new one
  # (38368c8...4a612b1: ahead 0, behind 7), and the full suite passes against
  # it: 14 passed, 0 failed. The bump is 7 commits, not 1 — horus-docs#18 is
  # only the newest of them, and that suite result is what says the other six,
  # written by other people for other reasons, are compatible with this branch.
  DOCS_PINNED_REF: 9a1a0c107bc2e04b75cbdd08a04462e242285bce

jobs:
  # ── Tier 1 ────────────────────────────────────────────────────────────────
  # No docs checkout, no network. Catches a PR that removes a command or flag
  # the docs rely on, using the committed snapshot.
  contract-hermetic:
    name: CLI contract (hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-docs-

      # The extractor unit tests come first: if extraction silently breaks, the
      # contract tests still pass while checking nothing.
      - name: Extractor unit tests
        run: |
          cargo test -p horus_manager --test docs_examples extractor
          cargo test -p horus_manager --test docs_examples_cpp extractor
          cargo test -p horus_manager --test docs_examples_python extractor

      # Hermetic and fast: every public C++ header must compile on its own,
      # independent of include order and of any docs checkout.
      - name: C++ headers are self-contained
        run: cargo test -p horus_manager --test docs_examples_cpp public_headers_are_self_contained

      # `docs_contract`'s page-reading tests are `#[ignore]`d, because they need
      # a horus-docs checkout and this tier by definition has none: running them
      # here failed all eleven every day rather than checking anything. What is
      # left runs without a checkout — the skip-or-fail policy itself, and the
      # guard that contract-live below really does pass --include-ignored, which
      # is what keeps the `#[ignore]` from becoming the silent skip it replaced.
      #
      # `docs_cli_contract` is the one that checks the CLI reference. Both steps
      # here used to run `docs_contract` under a "CLI contract" name, so the CLI
      # reference was advertised as covered while nothing checked it.
      - name: Docs contract policy and wiring
        run: cargo test -p horus_manager --test docs_contract

      # `horus new` must produce the tree the quick-starts tell readers to open.
      - name: Scaffold layout contract
        run: cargo test -p horus_manager --test docs_scaffold

      # Runtime promises (shutdown ordering, buffer sizing, descriptor layout).
      # Pure assertions against horus_core — no docs checkout needed.
      - name: Behavioural contract
        run: cargo test -p horus_manager --test docs_behavior

  # ── Tier 2 ────────────────────────────────────────────────────────────────
  # Same assertions, but against a real docs checkout, so a page that starts
  # documenting a command this repo does not have is caught too.
  contract-live:
    name: CLI contract (live docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout horus-docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: softmata/horus-docs
          ref: ${{ env.DOCS_PINNED_REF }}
          path: horus-docs

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # Restore only — never save. This job builds a second repository's
      # content, so its output is downstream of code this repo does not review
      # on the way in. Saving would write the same `-cargo-docs-` key that
      # contract-hermetic — which checks out nothing but this repo — restores
      # and executes on the default branch. contract-hermetic is the sole
      # writer of that key, so there is no path from docs content into a cache
      # that trusted jobs consume.
      - name: Restore Cargo cache (read-only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-docs-

      # `--include-ignored`, not `--ignored`: the page-reading tests carry
      # `#[ignore]` so the hermetic tier can leave them alone, and the two
      # skip-policy tests that do not carry it are worth running against a real
      # checkout as well. This is the only job that opens a page, so a step that
      # loses the flag stops checking the docs entirely while staying green —
      # `the_live_docs_job_runs_the_tests_this_file_ignores` fails if it does.
      - name: Manifest and hook contract against live docs
        env:
          HORUS_DOCS_DIR: ${{ github.workspace }}/horus-docs
        run: cargo test -p horus_manager --test docs_contract -- --include-ignored

      # The README Quick Start, compiled against exactly the dependency set a
      # `horus new -r` project gets. It carries `#[ignore]` with the reason "run
      # in the docs-contract job" — and until now no job ran it: no workflow
      # named readme_contract, and the `--include-ignored` above reaches only
      # docs_contract. So the test written because the front-page Quick Start
      # did not compile was itself never executed. ~25s.
      - name: README Quick Start compiles
        run: cargo test -p horus_manager --test readme_contract -- --include-ignored

      # Every `horus ...` invocation in the docs, resolved against the real clap
      # tree. Cheap: one `--help` per distinct command, not one per invocation.
      - name: CLI contract against live docs
        env:
          HORUS_DOCS_DIR: ${{ github.workspace }}/horus-docs
        run: cargo test -p horus_manager --test docs_cli_contract

      # C++ type-checking needs only g++ and the headers — no cmake, no linking —
      # so unlike the Rust sweep it is cheap enough to gate every PR. Nothing
      # else in either repository compiles these 260 blocks.
      - name: C++ examples type-check
        env:
          HORUS_DOCS_DIR: ${{ github.workspace }}/horus-docs
        run: cargo test -p horus_manager --test docs_examples_cpp -- --ignored --nocapture

      # Syntax only here; the API-shape check needs a built wheel and lives in
      # the scheduled job below.
      - name: Python examples parse
        env:
          HORUS_DOCS_DIR: ${{ github.workspace }}/horus-docs
        run: |
          cargo test -p horus_manager --test docs_examples_python -- \
            --ignored documented_python_examples_parse --nocapture

      # Documented horus.toml keys and HORUS_* variables. Cheap: no compilation.
      - name: Manifest and environment contract
        env:
          HORUS_DOCS_DIR: ${{ github.workspace }}/horus-docs
        run: cargo test -p horus_manager --test docs_manifest -- --ignored --nocapture

      # docs_parity carries #[ignore = "... wired into the docs-contract
      # workflow"] on all three of its tests — and was wired into nothing. No
      # workflow named docs_parity, and while integration-tests.yml's
      # `--test '*'` does select the target, an all-ignored binary exits 0
      # reporting "0 passed; 3 ignored", which reads as coverage.
      #
      # What went unchecked: that every HORUS_* variable shipped code reads
      # appears in the documentation, and that a documented `horus = "x.y"`
      # resolves to the crate we ship rather than to the unrelated crate that
      # holds that name on crates.io.
      - name: Environment and version parity against live docs
        env:
          HORUS_DOCS_DIR: ${{ github.workspace }}/horus-docs
        run: cargo test -p horus_manager --test docs_parity -- --ignored --nocapture

      # A snapshot that has drifted from the pinned docs means tier 1 is
      # checking a stale contract. Not fatal, but it should be visible.
      # A step here used to regenerate tests/fixtures/docs-cli-contract.json and
      # warn when it drifted. It invoked `--test docs_contract -- --ignored
      # regenerate_docs_cli_contract`, a test that does not exist, with `|| true`
      # swallowing the failure — so the hash never changed and the warning never
      # fired. The fixture it guarded is gone: `docs_cli_contract` now extracts
      # invocations from the docs checkout directly, so there is no snapshot to
      # keep in step.


  # ── Shipped examples ──────────────────────────────────────────────────────
  # The projects under examples/ are what a reader clones and runs first.
  # Nothing built them: `examples-compile` below compiles snippets *extracted
  # from the docs*, which is a different set, and the `every_example_builds`
  # test guards itself behind HORUS_TEST_BUILD_EXAMPLES, which was set nowhere.
  # Fifteen of the sixteen shipped examples were broken and CI was green.
  #
  # This job used to be gated `if: github.event_name == 'schedule' ||
  # inputs.run_compile_sweep`, on the reasoning that it is a full build per
  # example against the whole HORUS tree and that "the cheap static half of
  # examples_contract does run on every PR as part of the normal horus_manager
  # test job". That second half was not true: ci.yml runs
  # `cargo test --workspace --lib`, which builds only library test targets and
  # never touches an integration test like examples_contract. So no part of this
  # ran per-PR, and a PR that broke an example stayed green until the next
  # nightly — by which point the break is a bisect, not a review comment.
  #
  # It runs per-PR now, and the cost is paid down rather than deferred:
  # CARGO_TARGET_DIR points every example at one shared, cached target
  # directory. They all depend on the same horus/horus_core/horus_types path
  # deps, so the graph compiles once and each example adds one small crate. The
  # package names are distinct, so no two examples overwrite each other's
  # binary there (which is the one hazard of sharing — see build_dirs.rs).
  # Measured locally on a cold shared target directory: all twelve examples
  # built in 114 s and 1.5 GB total, against roughly a gigabyte each when every
  # example keeps its own .horus/target.
  shipped-examples-build:
    name: Shipped examples build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # `horus build` generates .horus/Cargo.toml with path dependencies into
      # the HORUS source tree, which cargo_gen locates via
      # find_horus_source_dir(). That function probes /horus, ~/horus,
      # ~/softmata/horus, /opt/horus and the installer's cache — none of which
      # is where actions/checkout puts the repository. Without this the job
      # fails on the first example with "HORUS source not found", which is a
      # thing nobody noticed while it only ever ran at 04:00.
      HORUS_SOURCE: ${{ github.workspace }}
      # One target directory for every example. See the note above.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # cmake and a C++17 compiler are here for differential_drive_cpp: it is a
      # horus.toml project like the others, so `horus build` drives cmake and
      # links libhorus_cpp.a. ubuntu-latest ships cmake, make and g++, but name
      # them anyway rather than depending on the image's contents.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config cmake g++ make

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-examples-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-examples-

      # Both halves of examples_contract in one invocation: the static manifest
      # and macro-shape checks, and — because HORUS_TEST_BUILD_EXAMPLES is set —
      # the full `horus build` of every example.
      - name: Build every shipped example
        env:
          HORUS_TEST_BUILD_EXAMPLES: "1"
        run: cargo test -p horus_manager --test examples_contract -- --nocapture

  examples-compile:
    name: Rust examples compile
    if: github.event_name == 'schedule' || inputs.run_compile_sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout horus-docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: softmata/horus-docs
          ref: ${{ env.DOCS_PINNED_REF }}
          path: horus-docs

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # Restore only, for the same reason as contract-live: this job builds a
      # second repository's content. It reads the hermetic job's key rather
      # than a private one, since a key nothing writes would never hit — and
      # the registry and git-db entries, which dominate restore time, are
      # identical either way.
      - name: Restore Cargo cache (read-only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-docs-

      # Warm the shared target dir the sweep reuses, so the per-batch cargo
      # check invocations do not each rebuild the horus dependency graph.
      - name: Pre-build horus
        run: cargo check -p horus -p horus_core -p horus_types

      # The C++ link sweep needs the staticlib that carries the C ABI the
      # header-only C++ layer calls into.
      - name: Build horus_cpp staticlib
        run: cargo build -p horus_cpp

      # -fsyntax-only proves a translation unit is well-formed; it cannot prove
      # the functions it calls are defined. Linking catches declared-but-missing
      # symbols and template instantiations that vanish at link time.
      - name: C++ programs link
        env:
          HORUS_DOCS_DIR: ${{ github.workspace }}/horus-docs
        run: |
          cargo test -p horus_manager --test docs_examples_cpp -- \
            --ignored documented_cpp_programs_link --nocapture

      - name: Compile documented Rust examples
        id: sweep
        env:
          HORUS_DOCS_DIR: ${{ github.workspace }}/horus-docs
        run: |
          set -o pipefail
          cargo test -p horus_manager --test docs_examples -- \
            --ignored --nocapture 2>&1 | tee sweep.log

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Documented Rust examples"
            echo
            echo '```'
            grep -E 'rust blocks:|contradict the real horus API|advisory, not enforced|no documented Rust example' sweep.log || true
            echo '```'
            if grep -q 'contradict the real horus API' sweep.log; then
              echo
              echo "<details><summary>Examples contradicting the horus API</summary>"
              echo
              echo '```'
              sed -n '/contradict the real horus API/,/These resolved/p' sweep.log || true
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sweep log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-example-sweep
          path: sweep.log
          retention-days: 14

  # ── Tier 3b ───────────────────────────────────────────────────────────────
  # `horus.Scheduler(blackbox=64)` is valid Python that raises TypeError at
  # runtime, so syntax checking cannot catch it. Verifying it needs the module's
  # real shape, which means building the wheel — minutes, hence not a PR gate.
  #
  # Nothing here executes doc code: snippets open shared memory, spin schedulers
  # and touch hardware. Attributes and signatures are read reflectively instead.
  python-api:
    name: Python API references exist
    if: github.event_name == 'schedule' || inputs.run_compile_sweep
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout horus-docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: softmata/horus-docs
          ref: ${{ env.DOCS_PINNED_REF }}
          path: horus-docs

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Build and install the horus wheel
        run: |
          pip install maturin
          cd horus_py
          # `--out`, rather than guessing where the wheel landed. horus_py is
          # a workspace member with no [workspace] of its own, so maturin hands
          # the build to cargo and the wheel appears under the *workspace*
          # target dir — `target/wheels`, not `horus_py/target/wheels`, which
          # is what this step used to install from. Naming the output directory
          # also survives a CARGO_TARGET_DIR pointing somewhere else entirely,
          # which `../target/wheels` would not: shipped-examples-build in this
          # same workflow already sets one.
          #
          # The old path did not fail loudly. Nothing matched the glob, bash
          # passed it through literally, and pip printed
          #   WARNING: Requirement 'target/wheels/*.whl' looks like a filename,
          #            but the file does not exist
          #   ERROR: Invalid wheel filename (wrong number of parts): '*'
          # so the job reported a wheel problem rather than a path problem.
          maturin build --release --out dist
          pip install --force-reinstall dist/*.whl

      - name: Confirm the wheel is the real module
        run: |
          # Run outside the repo: the `horus/` source directory shadows the
          # installed package as a namespace package, yielding a module with no
          # attributes and making every assertion below fail for the wrong reason.
          cd "$RUNNER_TEMP"
          python -c "import horus; assert hasattr(horus,'Scheduler'), 'shadowed'; print('horus', horus.__version__)"

      - name: Python API references exist
        env:
          HORUS_DOCS_DIR: ${{ github.workspace }}/horus-docs
        run: |
          cargo test -p horus_manager --test docs_examples_python -- \
            --ignored documented_python_api_exists --nocapture

  # The single check branch protection points at. shipped-examples-build is in
  # `needs` because a job that merely turns red on the PR page is not a gate:
  # only a required check blocks a merge, and adding it here means the one
  # required name covers it without touching branch-protection settings.
  docs-contract-success:
    name: Docs Contract Success
    permissions: {}
    needs: [contract-hermetic, contract-live, shipped-examples-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "Hermetic: ${{ needs.contract-hermetic.result }}"
          echo "Live:     ${{ needs.contract-live.result }}"
          echo "Examples: ${{ needs.shipped-examples-build.result }}"
          FAIL=""
          [ "${{ needs.contract-hermetic.result }}" = "success" ] || FAIL="$FAIL hermetic"
          [ "${{ needs.contract-live.result }}" = "success" ] || FAIL="$FAIL live"
          [ "${{ needs.shipped-examples-build.result }}" = "success" ] || FAIL="$FAIL examples"
          if [ -n "$FAIL" ]; then
            echo "Docs contract failed:$FAIL"
            echo "This PR changes the CLI in a way the published documentation contradicts."
            echo "(\"examples\" means a project under examples/ no longer builds.)"
            exit 1
          fi
          echo "Docs contract upheld."
