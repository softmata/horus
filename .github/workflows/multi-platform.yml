# HORUS Multi-Platform Testing
# Tests on macOS, Windows, ARM64, and validates MSRV

name: Multi-Platform

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]  # dev is kept identical to main; PRs still gate

  schedule:
    # Run weekly on Tuesday at 4 AM UTC
    - cron: '0 4 * * 2'
  workflow_dispatch:

concurrency:
  # Cancel superseded runs: a rapid series of pushes used to leave every
  # earlier run grinding to completion long after it was obsolete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Minimum Supported Rust Version
  MSRV: "1.92.0"
  # horus_manager's cargo_gen/cmake_gen/new/pkg tests generate .horus build
  # files, which needs the HORUS source tree. find_horus_source_dir() only
  # probes ~/softmata/horus, ~/horus, /opt/horus etc. — none of which exist
  # on a runner — so point it at the checkout.
  HORUS_SOURCE: ${{ github.workspace }}

permissions:
  contents: read

jobs:
  # macOS Testing
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check
        run: cargo check --workspace --exclude horus_py

      - name: Build
        run: cargo build --workspace --exclude horus_py

      - name: Test
        run: |
          # Exclude crates with platform-specific dependencies:
          # - horus_py: requires Python headers
          # - horus_benchmarks: timing uses RDTSC/Linux-specific fallbacks
          # Raw SHM integration tests encode Linux /dev/shm layout assumptions;
          # cross-platform behavior is exercised by parity.yml. Test portable
          # library targets here after the full workspace check/build above.
          cargo test -p horus_types -p horus_macros -p horus_cpp_macros \
            -- --test-threads=1
        env:
          HORUS_NAMESPACE: ci_macos_${{ github.run_id }}
          RUST_BACKTRACE: 1

  # macOS ARM64 (Apple Silicon)
  macos-arm64:
    name: macOS ARM64
    runs-on: macos-14  # M1 runner
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-arm64-cargo-

      - name: Check
        run: cargo check --workspace --exclude horus_py

      - name: Build
        run: cargo build --workspace --exclude horus_py

      - name: Test
        run: |
          # Exclude crates with platform-specific dependencies:
          # - horus_py: requires Python headers
          # - horus_benchmarks: timing uses RDTSC/Linux-specific fallbacks
          cargo test -p horus_types -p horus_macros -p horus_cpp_macros \
            -- --test-threads=1
        env:
          HORUS_NAMESPACE: ci_macos_arm64_${{ github.run_id }}
          RUST_BACKTRACE: 1

  # Windows Testing
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # horus_net is excluded: it has no Windows event loop. event_loop/mod.rs
      # provides epoll (Linux) and kqueue (macOS) only — its doc comment claims
      # a polling fallback for other platforms, but none was ever written, so
      # PlatformEventLoop simply does not exist on Windows and replicator.rs
      # also calls libc::write directly. Adding an IOCP backend is a feature,
      # not a CI fix. Everything else in the workspace does build for Windows.
      - name: Check
        run: cargo check --workspace --exclude horus_net --no-default-features

      - name: Build (lib only)
        run: cargo build --workspace --exclude horus_net --lib --no-default-features

      - name: Test (horus_sys + horus_core)
        run: |
          cargo test --no-default-features -p horus_sys --lib -- --test-threads=1
          cargo test --no-default-features -p horus_core --lib -- --test-threads=1
        env:
          HORUS_NAMESPACE: ci_win_${{ github.run_id }}
          RUST_BACKTRACE: 1

  # Linux ARM64 Cross-Compilation
  linux-arm64:
    name: Linux ARM64 (Cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # g++ is required too: the cxx/link-cplusplus build scripts probe for
          # aarch64-linux-gnu-g++ and hard-fail when only gcc is present.
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libudev-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-arm64-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-arm64-cross-

      - name: Configure Cross-Compilation
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml << EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Check ARM64 Build
        run: |
          # Exclude horus_manager (OpenSSL dependency) and horus_benchmarks
          # Cross-compiling OpenSSL requires ARM64 development headers
          cargo check --workspace --target aarch64-unknown-linux-gnu --lib \
            --exclude horus_manager --exclude horus_benchmarks
        env:
          PKG_CONFIG_ALLOW_CROSS: 1

  # MSRV (Minimum Supported Rust Version) Testing
  msrv:
    name: MSRV (${{ matrix.rust }})
    runs-on: ubuntu-latest
    env:
      HORUS_NAMESPACE: ci_${{ github.run_id }}
    strategy:
      matrix:
        rust: ["1.92.0"]  # MSRV
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      # No caching for MSRV - build fresh to avoid incremental compilation issues
      # These linking errors occur with stale cached artifacts

      - name: Setup Shared Memory
        run: |
          # Create namespaced SHM directory structure
          SHM_DIR="/dev/shm/horus_ci_${GITHUB_RUN_ID:-$$}"
          # No sudo: sudo mkdir leaves these root-owned, which is what made
          # SchedulerRegistry::open and the presence writer fail with
          # PermissionDenied. Create them as the runner and keep 0700 —
          # regression_shm_topics_dir_permissions_restricted asserts the topics
          # dir is owner-only, so chmod 777 here would break that guarantee.
          mkdir -p "$SHM_DIR"/{topics,nodes,control,network,scheduler}
          chmod -R 700 "$SHM_DIR"

      - name: Check MSRV Compatibility
        run: cargo check --workspace

      - name: Test MSRV Compatibility
        run: |
          # Exclude problematic crates due to workspace linking issues
          # horus/horus_library: workspace linkage errors
          # horus_manager: persistent linker errors with older Rust
          # horus_py: requires Python dev headers
          # Use single-threaded tests to avoid race conditions in static discovery topic
          # (UnsafeCell<LocalState> is not thread-safe for parallel test access)
          cargo test --workspace --lib --no-fail-fast \
            --exclude horus --exclude horus_library --exclude horus_py \
            --exclude horus_manager \
            -- --test-threads=1 \
            --skip topic_cross_thread_mpmc_pre_initialized_99_percent \
            --skip topic_cross_thread_multi_p_multi_c_mpmc \
            --skip test_robotics_autonomous_car_perception
        env:
          RUST_BACKTRACE: 1

  # Summary job
  multi-platform-success:
    name: Multi-Platform Success
    needs: [macos, macos-arm64, windows, linux-arm64, msrv]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Results
        run: |
          echo "macOS: ${{ needs.macos.result }}"
          echo "macOS ARM64: ${{ needs.macos-arm64.result }}"
          echo "Windows: ${{ needs.windows.result }}"
          echo "Linux ARM64: ${{ needs.linux-arm64.result }}"
          echo "MSRV: ${{ needs.msrv.result }}"

          # All Unix platforms and MSRV must pass
          FAILURES=""

          if [[ "${{ needs.macos.result }}" != "success" ]]; then
            FAILURES="$FAILURES macOS"
          fi

          if [[ "${{ needs.macos-arm64.result }}" != "success" ]]; then
            FAILURES="$FAILURES macOS-ARM64"
          fi

          if [[ "${{ needs.linux-arm64.result }}" != "success" ]]; then
            FAILURES="$FAILURES Linux-ARM64"
          fi

          if [[ "${{ needs.msrv.result }}" != "success" ]]; then
            FAILURES="$FAILURES MSRV"
          fi

          # Windows is now a hard gate (no longer continue-on-error)
          if [[ "${{ needs.windows.result }}" != "success" ]]; then
            FAILURES="$FAILURES Windows"
          fi

          if [[ -n "$FAILURES" ]]; then
            echo "Platform failures:$FAILURES"
            exit 1
          fi

          echo "All required platforms passed!"
