# HORUS Code Coverage
# Measures test coverage and uploads to Codecov

name: Coverage

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]  # dev mirrors main; PRs still gate dev work

concurrency:
  # Cancel superseded runs: a rapid series of pushes used to leave every
  # earlier run grinding to completion long after it was obsolete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # horus_manager's cargo_gen/cmake_gen/new/pkg tests generate .horus build
  # files, which needs the HORUS source tree. find_horus_source_dir() only
  # probes ~/softmata/horus, ~/horus, /opt/horus etc. — none of which exist
  # on a runner — so point it at the checkout.
  HORUS_SOURCE: ${{ github.workspace }}

permissions:
  contents: read

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    continue-on-error: true  # Coverage has instrumentation issues with complex workspaces
    # The instrumented suite runs single-threaded and contains many wall-clock
    # bound tests. Without an explicit cap it can run against GitHub's 6-hour
    # ceiling and — because of continue-on-error above — burn the whole budget
    # and still report nothing. Fail fast instead.
    timeout-minutes: 120
    env:
      HORUS_NAMESPACE: ci_${{ github.run_id }}
      # LLVM coverage instrumentation substantially increases stack usage in
      # topic contention tests. Propagate a larger stack to libtest workers.
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ libudev-dev pkg-config \
            libeigen3-dev libfmt-dev libgtest-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ae83f8e2d0da9969dc5a35e824115e142fd3c341 # cargo-llvm-cov

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-

      # Setup shared memory for HORUS tests
      - name: Setup Shared Memory
        run: |
          # Create namespaced SHM directory structure
          SHM_DIR="/dev/shm/horus_ci_${GITHUB_RUN_ID:-$$}"
          # No sudo: sudo mkdir leaves these root-owned, which is what made
          # SchedulerRegistry::open and the presence writer fail with
          # PermissionDenied. Create them as the runner and keep 0700 —
          # regression_shm_topics_dir_permissions_restricted asserts the topics
          # dir is owner-only, so chmod 777 here would break that guarantee.
          mkdir -p "$SHM_DIR"/{topics,nodes,control,network,scheduler}
          chmod -R 700 "$SHM_DIR"

      # horus_core's cross_language_ipc test binary invokes Python subprocesses.
      # Install the native module even though horus_py itself is excluded from
      # Rust coverage, otherwise those subprocesses import the mock fallback.
      - name: Build and install Python extension
        run: |
          python3 -m venv /tmp/horus-coverage-venv
          /tmp/horus-coverage-venv/bin/pip install maturin
          VIRTUAL_ENV=/tmp/horus-coverage-venv \
            /tmp/horus-coverage-venv/bin/maturin develop --manifest-path horus_py/Cargo.toml
          echo "/tmp/horus-coverage-venv/bin" >> "$GITHUB_PATH"

      - name: Generate Coverage Report
        run: |
          # Exclude crates with workspace linkage issues
          # Skip flaky tests that depend on shared memory state or timing
          # test_direct_channel_latency_estimation: flaky due to coverage instrumentation affecting timing
          #
          # test_high_performance_config and test_auto_derive_tick_rate_from_fastest_node
          # are the same class: both assert a tick COUNT as a proxy for a rate
          # (10kHz over 50ms wanting >=10 of ~500; 500Hz over 50ms wanting >=5 of
          # ~25). llvm-cov instruments every function, so a tick loop that fast
          # cannot hold its rate here and the count measures the instrumentation
          # rather than the scheduler -- this job saw 1 tick against a threshold
          # of 10. Both keep their teeth: integration-tests.yml runs the whole
          # `--test '*'` set in RELEASE, uninstrumented, and skips neither.
          cargo llvm-cov --workspace \
            --exclude horus_benchmarks \
            --exclude horus \
            --exclude horus_library \
            --exclude horus_py \
            --lcov --output-path lcov.info \
            -- --test-threads=1 --skip test_robot_performance_metrics --skip test_enhanced_scheduler --skip test_custom_exotic_robot_config --skip test_robotics_autonomous_car_perception --skip topic_cross_thread_1p_multi_c_spmc --skip topic_cross_thread_mpmc_pre_initialized_99_percent --skip topic_cross_thread_multi_p_multi_c_mpmc --skip multithread_nonpod_subscribers_each_get_full_stream --skip hlog_latency_under_contention_4_threads --skip hlog_latency_p99_under_50us --skip dual_write_overhead_acceptable --skip shm_fanout_latency_percentiles_cross_thread --skip stress_rt_1khz_under_cpu_contention --skip stress_rt_1khz_baseline_no_contention --skip stress_rt_multi_rate_under_contention --skip stress_rt_isolation_from_compute_nodes --skip test_high_performance_config --skip test_auto_derive_tick_rate_from_fastest_node --skip xproc_
        env:
          RUST_BACKTRACE: 1

      - name: Generate HTML Report
        run: |
          # Reuse the profiles produced above instead of running every test a
          # second time just to render a different output format.
          cargo llvm-cov report --html --output-dir coverage-html

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload HTML Report as Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage-html/
          retention-days: 30

      - name: Coverage Summary
        run: |
          # Render the summary from the same saved profiles; do not execute a
          # third instrumented test pass.
          # NOT `--text`: that is `llvm-cov show`, which emits per-line annotated
          # source for every instrumented file (tens of MB) and blows past
          # GitHub's 1 MiB step-summary cap, discarding the summary entirely.
          # Bare `report` prints the per-file + TOTAL coverage table.
          cargo llvm-cov report | tee coverage-summary.txt
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage-summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
