# Monitor Test Suite
# Comprehensive test pipeline for horus_manager monitor functionality.
#
# Tiers:
#   - Unit tests: Run on every PR (fast, no SHM needed for most)
#   - UAT integration tests: Run on PR + merge to main
#   - Stress tests: Manual dispatch only (slow, resource-intensive)

name: Monitor Tests

on:
  pull_request:
    branches: [main, master, dev]
    paths:
      - 'horus_manager/**'
      - 'horus_core/**'
      - 'horus_library/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main, master]  # dev mirrors main; PRs still gate dev work
    paths:
      - 'horus_manager/**'
      - 'horus_core/**'
      - 'horus_library/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  # Cancel superseded runs: a rapid series of pushes used to leave every
  # earlier run grinding to completion long after it was obsolete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  HORUS_NAMESPACE: ci_${{ github.run_id }}
  # horus_manager's cargo_gen/cmake_gen/new/pkg tests generate .horus build
  # files, which needs the HORUS source tree. find_horus_source_dir() only
  # probes ~/softmata/horus, ~/horus, /opt/horus etc. — none of which exist
  # on a runner — so point it at the checkout.
  HORUS_SOURCE: ${{ github.workspace }}

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  #  Unit Tests — fast, every PR
  # ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # cmake_gen's real_cmake_* tests shell out to cmake and
          # find_package(Eigen3/fmt/GTest), so those dev packages must exist.
          sudo apt-get install -y libudev-dev pkg-config \
            cmake libeigen3-dev libfmt-dev libgtest-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-monitor-unit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-monitor-unit-

      - name: Setup SHM directories
        run: |
          # Create namespaced SHM directory structure
          SHM_DIR="/dev/shm/horus_ci_${GITHUB_RUN_ID:-$$}"
          # No sudo: sudo mkdir leaves these root-owned, which is what made
          # SchedulerRegistry::open and the presence writer fail with
          # PermissionDenied. Create them as the runner and keep 0700 —
          # regression_shm_topics_dir_permissions_restricted asserts the topics
          # dir is owner-only, so chmod 777 here would break that guarantee.
          mkdir -p "$SHM_DIR"/{topics/horus_topic,nodes,control,network,scheduler}
          chmod -R 700 "$SHM_DIR"

      - name: Run unit tests (lib)
        run: cargo test -p horus_manager --lib -- --test-threads=1

      # `--test monitor_tests` named a target that has never existed on main
      # (`git log --all -- horus_manager/tests/monitor_tests.rs` is empty), so
      # this step could not have passed since the workflow was added in
      # 243281e9. It went unnoticed because the lib step above it was failing
      # first. `harness_tests` is the real target exercising the monitor
      # harness — node discovery, topic creation, blackbox injection.
      - name: Run harness integration tests
        run: cargo test -p horus_manager --test harness_tests -- --test-threads=1

  # ─────────────────────────────────────────────────────────────────────────────
  #  UAT Integration Tests — every PR + merge
  # ─────────────────────────────────────────────────────────────────────────────
  uat-tests:
    name: UAT Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-monitor-uat-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-monitor-uat-

      - name: Setup SHM directories
        run: |
          # Create namespaced SHM directory structure
          SHM_DIR="/dev/shm/horus_ci_${GITHUB_RUN_ID:-$$}"
          # No sudo: sudo mkdir leaves these root-owned, which is what made
          # SchedulerRegistry::open and the presence writer fail with
          # PermissionDenied. Create them as the runner and keep 0700 —
          # regression_shm_topics_dir_permissions_restricted asserts the topics
          # dir is owner-only, so chmod 777 here would break that guarantee.
          mkdir -p "$SHM_DIR"/{topics/horus_topic,nodes,control,network,scheduler}
          chmod -R 700 "$SHM_DIR"

      # These six named uat_node_discovery / uat_topic_monitoring /
      # uat_parameter_management / uat_recording_debug / uat_websocket_live /
      # uat_auth_flow. None of them exist on main — the UAT suites were
      # consolidated into a single `uat_workflows` target. Like the step above,
      # they were never reached because the unit-test job failed first.
      - name: UAT — end-to-end workflows
        run: cargo test -p horus_manager --test uat_workflows -- --test-threads=1

  # ─────────────────────────────────────────────────────────────────────────────
  #  Stress Tests — manual dispatch only
  # ─────────────────────────────────────────────────────────────────────────────
  stress-tests:
    name: Stress Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # No cache for stress tests — clean build avoids stale artifact issues
      - name: Clean build
        run: cargo clean

      - name: Setup SHM directories
        run: |
          # Create namespaced SHM directory structure
          SHM_DIR="/dev/shm/horus_ci_${GITHUB_RUN_ID:-$$}"
          # No sudo: sudo mkdir leaves these root-owned, which is what made
          # SchedulerRegistry::open and the presence writer fail with
          # PermissionDenied. Create them as the runner and keep 0700 —
          # regression_shm_topics_dir_permissions_restricted asserts the topics
          # dir is owner-only, so chmod 777 here would break that guarantee.
          mkdir -p "$SHM_DIR"/{topics/horus_topic,nodes,control,network,scheduler}
          chmod -R 700 "$SHM_DIR"

      # stress_scale / stress_churn do not exist on main. `discovery_stress` is
      # the real stress target in this crate. NOTE: it currently has known
      # failing tests (presence cleanup on drop, and clean_shm() in the first
      # test leaving the rest with 0 nodes) — pre-existing, tracked separately.
      - name: Stress — node discovery under load
        run: cargo test -p horus_manager --test discovery_stress -- --test-threads=1
        timeout-minutes: 10

  # The Chaos Tests job was removed: it ran `--test chaos_failure` and
  # `--test chaos_concurrent`, neither of which has ever existed on main, so
  # it could only ever fail. There is no chaos/fault-injection target in
  # horus_manager to point it at.

  monitor-tests-success:
    name: Monitor Tests Success
    runs-on: ubuntu-latest
    if: always()
    needs: [unit-tests, uat-tests, stress-tests]
    steps:
      - name: Check results
        run: |
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "uat-tests: ${{ needs.uat-tests.result }}"
          echo "stress-tests: ${{ needs.stress-tests.result }}"

          # Unit and UAT must pass (always run)
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "Unit tests failed!"
            exit 1
          fi
          if [[ "${{ needs.uat-tests.result }}" != "success" ]]; then
            echo "UAT tests failed!"
            exit 1
          fi

          # Stress only runs on manual dispatch — skip check if skipped
          if [[ "${{ needs.stress-tests.result }}" == "failure" ]]; then
            echo "Stress tests failed!"
            exit 1
          fi

          echo "All monitor tests passed!"
