# HORUS Safety Checks
# MIRI and other safety-focused testing
# Runs weekly and on-demand

name: Safety

on:
  schedule:
    # Run weekly on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      run_miri:
        description: 'Run MIRI checks'
        required: false
        default: true
        type: boolean
  pull_request:
    branches: [main]
    paths:
      # Only run on PRs that touch unsafe code
      - 'horus_core/src/memory/**'
      - 'horus_core/src/communication/**'

concurrency:
  # Cancel superseded runs: a rapid series of pushes used to leave every
  # earlier run grinding to completion long after it was obsolete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HORUS_NAMESPACE: ci_${{ github.run_id }}
  # horus_manager's generated-workspace tests need the checkout location.
  HORUS_SOURCE: ${{ github.workspace }}

permissions:
  contents: read

jobs:
  miri:
    name: MIRI - Undefined Behavior Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust Nightly with MIRI
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
        with:
          components: miri

      - name: Setup MIRI
        run: cargo miri setup

      # Setup shared memory for HORUS tests
      - name: Setup Shared Memory
        run: |
          # Create namespaced SHM directory structure
          SHM_DIR="/dev/shm/horus_ci_${GITHUB_RUN_ID:-$$}"
          # No sudo: sudo mkdir leaves these root-owned, which is what made
          # SchedulerRegistry::open and the presence writer fail with
          # PermissionDenied. Create them as the runner and keep 0700 —
          # regression_shm_topics_dir_permissions_restricted asserts the topics
          # dir is owner-only, so chmod 777 here would break that guarantee.
          mkdir -p "$SHM_DIR"/{topics,nodes,control,network,scheduler}
          chmod -R 700 "$SHM_DIR"

      # Run MIRI on the unsafe code it can actually execute.
      #
      # Miri cannot run anything that touches a file-backed mmap
      # ("unsupported operation: Miri does not support file-backed memory
      # mappings", raised from memmap2). Since the transport went SHM-only that
      # rules out most of horus_core: every Topic, the TensorPool, and therefore
      # every pool-backed type (tensor_handle, backend, tensor_pool, image,
      # pointcloud, depth_image, costmap, occupancy_grid). Each of the three
      # steps that used to live here died on the first such test, so this job
      # has never actually reported a UB result.
      #
      # What remains is the unsafe code Miri *can* execute: the SIMD copy
      # helpers, the RT allocator guard, and the SHM path helpers. Verified
      # locally under the same MIRIFLAGS.
      #
      # The mmap-backed paths are not left uncovered — ASan, TSan and the
      # valgrind job in cpp-bindings.yml exercise them on real memory.
      - name: MIRI - horus_core unsafe primitives (unit tests)
        run: |
          cargo miri test -p horus_core --lib -- \
            memory::simd memory::rt_allocator memory::platform
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-permissive-provenance

      # NOTE: the landmark/tracking/detection/segmentation Pod types moved to the
      # external horus-robotics repo when horus_library was decomposed (commit
      # 7b430279); their MIRI coverage lives in that repo's CI, not this workspace.

  asan:
    name: AddressSanitizer - Memory Error Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config \
            cmake g++ libeigen3-dev libfmt-dev libgtest-dev

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
        with:
          # rust-src is what -Zbuild-std needs to rebuild std instrumented.
          # rustfmt is a *test* dependency: this job runs the whole workspace,
          # and horus_manager's every_template_is_already_formatted shells out
          # to `rustfmt --check` to prove the scaffolded templates ship
          # formatted. Its tool_on_path("rustfmt") guard cannot skip the test
          # here — rustup's shim is always on PATH on a GitHub runner, so a
          # missing component is not "absent", it is a shim that exits with
          # "'rustfmt' is not installed for the toolchain 'nightly-...'" and
          # trips the assertion. The tsan job excludes horus_manager, so it
          # does not need this component.
          components: rust-src, rustfmt

      # Setup shared memory for HORUS tests
      - name: Setup Shared Memory
        run: |
          # Create namespaced SHM directory structure
          SHM_DIR="/dev/shm/horus_ci_${GITHUB_RUN_ID:-$$}"
          # No sudo: sudo mkdir leaves these root-owned, which is what made
          # SchedulerRegistry::open and the presence writer fail with
          # PermissionDenied. Create them as the runner and keep 0700 —
          # regression_shm_topics_dir_permissions_restricted asserts the topics
          # dir is owner-only, so chmod 777 here would break that guarantee.
          mkdir -p "$SHM_DIR"/{topics,nodes,control,network,scheduler}
          chmod -R 700 "$SHM_DIR"

      - name: Run Tests with AddressSanitizer
        run: |
          # horus_py is excluded for the same reason ci.yml excludes it: its
          # default pyo3 `extension-module` feature leaves the Python symbols
          # undefined, so the test binary cannot link (`linking with cc failed`).
          cargo +nightly test --workspace --exclude horus_py --lib -Zbuild-std \
            --target x86_64-unknown-linux-gnu -- --test-threads=1 \
            --skip benchmark_ffi_send_overhead \
            --skip large_graph_performance \
            --skip test_recording_overhead_benchmark \
            --skip test_robotics_autonomous_car_perception \
            --skip topic_cross_thread_1p_multi_c_spmc \
            --skip topic_cross_thread_mpmc_pre_initialized_99_percent \
            --skip topic_cross_thread_multi_p_multi_c_mpmc
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
          # LeakSanitizer reports process-lifetime allocations retained by the
          # Rust test harness as leaks after every test has passed. Keep ASan's
          # bounds/use-after-free checks and stack lifetime checking enabled;
          # leak checking needs a dedicated, suppressions-aware job.
          ASAN_OPTIONS: detect_leaks=0:detect_stack_use_after_return=1

  tsan:
    name: ThreadSanitizer - Data Race Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
        with:
          components: rust-src

      # Setup shared memory for HORUS tests
      - name: Setup Shared Memory
        run: |
          # Create namespaced SHM directory structure
          SHM_DIR="/dev/shm/horus_ci_${GITHUB_RUN_ID:-$$}"
          # No sudo: sudo mkdir leaves these root-owned, which is what made
          # SchedulerRegistry::open and the presence writer fail with
          # PermissionDenied. Create them as the runner and keep 0700 —
          # regression_shm_topics_dir_permissions_restricted asserts the topics
          # dir is owner-only, so chmod 777 here would break that guarantee.
          mkdir -p "$SHM_DIR"/{topics,nodes,control,network,scheduler}
          chmod -R 700 "$SHM_DIR"

      - name: Run Concurrent Tests with ThreadSanitizer
        run: |
          # See the ASan job: horus_py's pyo3 extension-module feature makes the
          # test binary unlinkable.
          # horus_manager tests spawn nested, non-instrumented Cargo builds;
          # mixing those artifacts with TSan is an intentional ABI mismatch.
          #
          # a_clone_growing_the_mapping_does_not_strand_its_siblings drives three
          # writers through `Topic::send`, which is `send_lossy`: when the ring is
          # full it overwrites the oldest unconsumed slot on purpose, and the
          # reader's stamp check is what discards the torn result. TSan sees the
          # payload memcpy of that overwrite against the reader's memcpy and
          # reports a race, correctly -- it cannot see that the stamp
          # re-validation downstream is what makes the read sound. The race it
          # names is the lossy contract, not the use-after-munmap this test
          # exists to catch, and that bug is a SIGSEGV every other job would
          # still see. Same reason migrate_pod_shm_to_spsc_shm and the
          # cross_thread MPMC tests are already skipped here.
          cargo +nightly test --workspace --exclude horus_py --exclude horus_manager \
            --lib -Zbuild-std \
            --target x86_64-unknown-linux-gnu -- --test-threads=1 \
            --skip benchmark_ffi_send_overhead \
            --skip large_graph_performance \
            --skip test_recording_overhead_benchmark \
            --skip migrate_pod_shm_to_spsc_shm \
            --skip test_watchdog_graduated_warning \
            --skip test_robotics_drone_fast_imu_slow_camera \
            --skip test_robotics_autonomous_car_perception \
            --skip test_tick_hz_very_large \
            --skip topic_cross_thread_1p_multi_c_spmc \
            --skip topic_cross_thread_mpmc_pre_initialized_99_percent \
            --skip topic_cross_thread_multi_p_multi_c_mpmc \
            --skip a_clone_growing_the_mapping_does_not_strand_its_siblings
        env:
          RUSTFLAGS: -Zsanitizer=thread
          TSAN_OPTIONS: second_deadlock_stack=1
