# Dependabot Configuration for HORUS
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Rust/Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(cargo)"
    labels:
      - "dependencies"
      - "rust"
    # `reviewers` was removed from the Dependabot schema (it no longer appears in
    # the options reference, unlike `assignees`), so it fails config validation.
    # `assignees` is the supported equivalent; use CODEOWNERS for review requests.
    assignees:
      - "lord-patpak"
    groups:
      # Group minor and patch updates together
      rust-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # NOTE: majors are deliberately NOT grouped. A "rust-major" group with
      # patterns ["*"] used to exist here, which contradicted its own comment
      # ("keep major updates separate for review"): it bundled every breaking
      # bump into a single PR. That is how #74 landed six majors at once, and
      # why one uncompilable crate in the batch took all eight build workflows
      # down with it. Ungrouped major updates get one PR each, so a bad one can
      # be closed without blocking the rest.
    ignore:
      # bincode 3.0.0 is a placeholder release: its entire src/lib.rs is
      # compile_error!("https://xkcd.com/2347/"), so it can never build. It is
      # nonetheless the newest non-yanked version, so Dependabot keeps
      # proposing it. The code here uses the 1.x API (bincode::serialize /
      # bincode::deserialize), which 2.x also removed.
      - dependency-name: "bincode"
        versions: [">=2.0.0"]
    # NOTE: there was an `ignore` rule here using
    # update-types: ["version-update:semver-prerelease"], which is not a valid
    # value — Dependabot accepts only semver-major/minor/patch, and rejected the
    # whole config file because of it. It was also unnecessary: Dependabot does
    # not propose a pre-release unless the dependency is already pinned to one.

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(actions)"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"

  # Python dependencies. The package lives in /horus_py (workspace member
  # "horus_py", pyproject.toml with the maturin build backend). The old
  # "/horus_python" path does not exist, which made Dependabot report a config
  # error for this entry and never open a Python PR.
  - package-ecosystem: "pip"
    directory: "/horus_py"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(python)"
    labels:
      - "dependencies"
      - "python"
    # Only run if directory exists
    allow:
      - dependency-type: "all"

  # npm — the Puppeteer-driven web E2E suite under horus_manager. This is the
  # only package.json in the tree and it ships a committed package-lock.json, so
  # `npm ci` there resolves a fixed 22-package graph (puppeteer, puppeteer-core,
  # ws, zod, yargs, modern-tar, …) that nothing in this repository was watching:
  # there was no npm entry here, and `cargo audit` does not see npm by
  # construction. That gap matters more than the package count suggests —
  # puppeteer is marked `hasInstallScript: true`, so `npm install` in that
  # directory runs a postinstall with the developer's privileges, and no CI
  # workflow runs the suite, which means the graph is exercised exclusively on
  # workstations where nothing would have flagged a malicious release.
  - package-ecosystem: "npm"
    directory: "/horus_manager/tests/web_e2e"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(npm)"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      # Same shape as the cargo entry: minor and patch batched, majors left
      # ungrouped so one breaking bump cannot take the others down with it.
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
