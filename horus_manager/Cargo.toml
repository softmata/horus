[package]
name = "horus_manager"
version = "0.4.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "CLI tool for the HORUS robotics framework — project scaffolding, build/run/test, package management, monitoring, deployment, and 46+ commands for Rust, Python, and C++ robotics projects"
authors = ["HORUS Team"]
repository = "https://github.com/softmata/horus"
homepage = "https://horusrobotics.dev"
documentation = "https://docs.horusrobotics.dev"
keywords = ["robotics", "cli", "build-tool", "horus", "ros"]
categories = ["science::robotics", "command-line-utilities", "development-tools"]
# Two binaries are declared below, so a bare `cargo run -p horus_manager` is
# ambiguous and aborts before the CLI starts. The parity/acceptance suites drive
# the CLI that way, so name the real entry point as the default.
default-run = "horus"

[lints]
workspace = true

[lib]
name = "horus_manager"
path = "src/lib.rs"

[[bin]]
name = "horus"
path = "src/main.rs"

[[bin]]
name = "ci_test_node"
path = "src/bin/ci_test_node.rs"


[dependencies]
horus_core = { path = "../horus_core" }
horus_types = { path = "../horus_types" }
horus-tf = { git = "https://github.com/softmata/horus-tf.git", rev = "d525dfcf58b99ee9c015ed5b0b3f20450b7c1e0c" }
horus_sys = { path = "../horus_sys" }
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"
# Renders the man page from the same clap tree the CLI is built from, so the
# page cannot describe a command the binary does not have.
clap_mangen = "0.3"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread", "time"] }
serde.workspace = true
serde_json.workspace = true
colored = "3.1"
indicatif = "0.18"
console = "0.16"
chrono = { workspace = true }
ctrlc = "3.4"
dirs = "6.0"
anyhow = "1.0"
thiserror = "2.0"
toml = "1.1"
toml_edit = "0.25"
# rustls-tls, NOT the default native-tls. reqwest's default features pull in
# hyper-tls -> native-tls -> openssl-sys, which needs an OpenSSL for the TARGET.
# release.yml's horus-linux-arm64 leg installs only gcc-aarch64-linux-gnu, so
# openssl-sys had no aarch64 OpenSSL to link and that leg could never produce a
# binary. rustls is pure Rust, so it cross-compiles cleanly and also drops the
# runtime dependency on the host's system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "blocking",
    "rustls-tls",
] }
tempfile = "3.10"
uuid = { version = "1.0", features = ["v4", "serde"] }
walkdir = "2.3"
sha2 = "0.11"
tar = "0.4"
flate2 = "1.0"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
regex = "1.10"
glob = "0.3"
log = "0.4"
env_logger = "0.11"
open = "5.0"
hostname = "0.4"
semver = "1.0"
libc = "0.2"
lazy_static = "1.4"
rayon = "1.10"
syn = { version = "3.0", features = ["full", "visit"] }
proc-macro2 = "1.0"
tree-sitter = "0.26"
tree-sitter-cpp = "0.23"
notify = "8.2"
num_cpus = "1.16"
schemars = { version = "1.2", optional = true }

rand = "0.9"
memmap2 = "0.9"

# Package signing
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
hex = "0.4"

[features]
# ============================================================================
# DEFAULT FEATURES
# ============================================================================
# CLI ships minimal by default, except for `schema`: a tool whose central
# config file is `horus.toml` should be able to describe it. Without this the
# generator below is compiled out of the shipped binary, which is why
# `generate_manifest_schema` had no caller but its own unit test.
default = ["schema"]

# ============================================================================
# OPTIONAL FEATURES
# ============================================================================

# JSON Schema generation for manifest types
schema = ["dep:schemars"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
assert_cmd = "2.0"
predicates = "3.0"
serde_json.workspace = true
# used by security integration tests
axum = { version = "0.8", features = ["ws"] }
horus_core = { path = "../horus_core" }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"
tokio-tungstenite = "0.30"
insta = "1"
